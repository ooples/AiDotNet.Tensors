name: Evolution lifecycle source integration

on:
  # Pull requests and pushes run this workflow through ci.yml, so each push is one CI run with one cancel
  # point. ci.yml's changes job applies this workflow's path filter (evolution-lifecycle in
  # .github/ci-path-filters.yml).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per ref; any other run (a push to main, a schedule) gets its own, so main
  # runs never cancel or replace one another and every push to main produces its results and coverage.
  group: evolution-lifecycle-${{ (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net10.0
          - os: ubuntu-latest
            framework: net8.0
          - os: windows-latest
            framework: net471
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tensors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ooples/AiDotNet.Evolution
          # The version the package ships: AiDotNet.Tensors.csproj references AiDotNet.Evolution 0.7.0 on every target
          # framework when UseLocalEvolution is off, so the lifecycle suite runs against that same source.
          ref: 4323954aa1a12c5669d2dc48b3669d1b13285acc # v0.7.0
          path: evolution
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build and test maintained autotune suite against pinned source dependency
        shell: pwsh
        working-directory: tensors
        run: >-
          dotnet test tests/AiDotNet.Tensors.Autotune.Tests/AiDotNet.Tensors.Autotune.Tests.csproj
          -c Release -f ${{ matrix.framework }}
          -p:UseLocalEvolution=true
          -p:EvolutionProjectPath=${{ github.workspace }}/evolution/src/AiDotNet.Evolution/AiDotNet.Evolution.csproj
          -p:GeneratePackageOnBuild=false
          --logger "trx;LogFileName=lifecycle.trx"
          --results-directory evidence --blame-hang-timeout 3m
          --settings tests/AiDotNet.Tensors.Autotune.Tests/autotune.runsettings
          --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}-${{ matrix.framework }}
          path: tensors/evidence
          if-no-files-found: error
