name: Evolution lifecycle source integration

on:
  pull_request:
    paths:
      - 'src/AiDotNet.Tensors/Helpers/Autotune/**'
      - 'src/AiDotNet.Tensors/AiDotNet.Tensors.csproj'
      - 'tests/AiDotNet.Tensors.Tests/Helpers/Autotune/**'
      - 'tests/AiDotNet.Tensors.Autotune.Tests/**'
      - '.github/workflows/evolution-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            framework: net10.0
          - os: ubuntu-latest
            framework: net8.0
          - os: windows-latest
            framework: net471
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          path: tensors
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          repository: ooples/AiDotNet.Evolution
          ref: 255feb24369702a32ea9db7a3f8a0b7a847d2762
          path: evolution
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build and test maintained autotune suite against pinned source dependency
        shell: pwsh
        working-directory: tensors
        run: >-
          dotnet test tests/AiDotNet.Tensors.Autotune.Tests/AiDotNet.Tensors.Autotune.Tests.csproj
          -c Release -f ${{ matrix.framework }}
          -p:UseLocalEvolution=true
          -p:EvolutionProjectPath=${{ github.workspace }}/evolution/src/AiDotNet.Evolution/AiDotNet.Evolution.csproj
          -p:GeneratePackageOnBuild=false
          --logger "trx;LogFileName=lifecycle.trx"
          --results-directory evidence --blame-hang-timeout 3m
          --settings tests/AiDotNet.Tensors.Autotune.Tests/autotune.runsettings
          --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}-${{ matrix.framework }}
          path: tensors/evidence
          if-no-files-found: error
