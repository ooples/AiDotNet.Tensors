name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  # Cancel a superseded PR run, never a push to main: every merge shares the main ref, so
  # cancelling there would kill the previous merge's analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis (C#)
    # The release-please PR and its merge commit carry only version/CHANGELOG edits.
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build AiDotNet.Tensors (net10.0)
        run: dotnet build src/AiDotNet.Tensors/AiDotNet.Tensors.csproj --configuration Release --framework net10.0 -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp
