name: GPU Parity (POCL / CPU-OpenCL)

# Why this lane exists
# --------------------
# The CPU-vs-GPU op-parity suites construct a real DirectGpuTensorEngine and compare every op
# against the trusted CPU oracle. On a GPU-less runner they *skip* — which is why a genuine GPU
# kernel bug (the LSTM seq-major-vs-batch-major layout defect) shipped in a release: nothing ever
# executed the kernels in CI. POCL (Portable Computing Language) exposes a CPU OpenCL device, so
# the DirectGpu OpenCL kernels can actually EXECUTE and be parity-checked on a stock ubuntu runner.
#   * AIDOTNET_OPENCL_ALLOW_CPU=1  — lets the OpenCL backend bind a CPU device as a fallback when no
#                                    GPU is present (default off; GPU always preferred).
#   * AIDOTNET_REQUIRE_GPU_TESTS=1 — turns "no GPU device" from a silent Skip into a hard failure.
#
# SHARDED: a single-process run of the full parity surface exhausts POCL partway through (it
# JIT-compiles every kernel it touches; after ~150 the OpenCL context is lost and later tests fail
# "no DirectGpu backend available"). So each parity class group runs as its OWN matrix job — a fresh
# runner + fresh POCL process per shard, so POCL never accumulates across groups. Only the
# backend-agnostic OpenCL-routed classes are included; the other GPU backends (Cuda/Hip/Metal/
# Vulkan/WebGpu) and the GPU-feature-specific OpenCL kernels (FlashDecode/PagedAttention/QuantGemm/
# RopeGqa) are excluded — POCL can't provide those devices/features, so they'd fail "unavailable".
#
# STATUS: recurrent-foundations is a required pass; the other shards are informational. POCL has shown intermittent
# DirectGpu-init failures on hosted runners that are unreproducible without POCL hardware locally.
# This runs + uploads a per-shard divergence report but never blocks. Promote a shard to required
# in branch protection only once it is reliably green here. The fully reliable gate remains real GPU
# hardware (the LSTM parity passes 234/234 on a local AMD RX 5500 XT).

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the repo to check out + build + test.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  gpu-parity-pocl:
    # Skip on the release-please Release PR and the release merge-commit push (mirrors build.yml).
    if: "${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release')) && !startsWith(github.head_ref, 'release-please--') }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry runs in its OWN job/runner (fresh POCL) so no single process compiles too many
        # kernels. The two big classes are single [Theory]s over the op registry (~550 forward, ~430
        # tape-gradient); AIDOTNET_PARITY_SHARD=k/N partitions each into sub-shards via ParityShard so
        # each POCL process stays under its per-process kernel-compile ceiling. `name` is the job label.
        include:
          - { name: recurrent-foundations, required: true, coverage: true, filter: "FullyQualifiedName~LstmGateKernelTests|FullyQualifiedName~LstmFinalStateGradientTests|FullyQualifiedName~XLstmDeviceTrainingTests" }
          - { name: lstm,            filter: "FullyQualifiedName~GpuMissingKernelsParityTests.LstmSequence" }
          - { name: missing-kernels, filter: "FullyQualifiedName~GpuMissingKernelsParityTests&FullyQualifiedName!~LstmSequence" }
          - { name: scan-kernels,    filter: "FullyQualifiedName~ScanGpuParityTests|FullyQualifiedName~Rwkv4WkvGpuParityTests" }
          # The GPU matmul backward for a single needed gradient (a constant basis or a data batch) has no other CI device;
          # its coverage is uploaded from here.
          - { name: matmul-single-gradient, coverage: true, filter: "FullyQualifiedName~GpuMatMulSingleGradientBackwardTests" }
          # The non-CUDA device training paths (the resident step off CUDA, device-side gradient clipping, device
          # optimizer storage) run nowhere else in CI: the coverage job has no GPU. This shard runs them on POCL and
          # uploads their coverage, so codecov measures them instead of reporting them as missed.
          - { name: resident-training, coverage: true, filter: "FullyQualifiedName~ResidentCompiledStepTests|FullyQualifiedName~GradientClippingStorageContractTests|FullyQualifiedName~CompiledOptimizerParameterViewTests|FullyQualifiedName~Fp16FullyResidentTrainingTests|FullyQualifiedName~FullParamResidentTrainingReproTests|FullyQualifiedName~GpuOptimizerStorageEpochTests|FullyQualifiedName~ConfigureOptimizerParamUpdateTests|FullyQualifiedName~ResidentWeightInvalidationDeviceStateTests|FullyQualifiedName~GpuReductionResidencyTests|FullyQualifiedName~AMSGradPaperModeTests|FullyQualifiedName~AMSGradDecoupledWeightDecayTests|FullyQualifiedName~GpuReshapeAliasAndLinearBackwardTests" }
          # The resident program on OpenCL (#1449): a row-local chain as one kernel, any other as ordinary enqueues, against a double-precision
          # reference. Metal's runs on metal.yml; Vulkan, WebGPU (Dawn) and HIP have no CI device.
          - { name: resident-program, coverage: true, filter: "FullyQualifiedName~OpenClResidentProgramTests" }
          # Model scale (#1569): ResNet-18 inference at batch 1 and 128 against the CPU (a batch-derived launch dimension
          # past a device limit only appears at model scale), warm training steps of five networks with no host crossing,
          # and the fused GRU, folded conv batch norm and TensorScope on a real OpenCL device.
          - { name: model-smoke, filter: "FullyQualifiedName~ModelInferenceSmokeTests|FullyQualifiedName~NetworkTrainingStepResidencyTests|FullyQualifiedName~GruSequenceTests|FullyQualifiedName~GruSequenceBackendParityTests.OpenCl|FullyQualifiedName~FusedConv2DBatchNormTests|FullyQualifiedName~TensorScopeTests" }
          - { name: op-forward-1, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "1/6" }
          - { name: op-forward-2, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "2/6" }
          - { name: op-forward-3, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "3/6" }
          - { name: op-forward-4, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "4/6" }
          - { name: op-forward-5, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "5/6" }
          - { name: op-forward-6, filter: "FullyQualifiedName~Engines.OpParity.OpParityTests", shard: "6/6" }
          - { name: tape-grad-1,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "1/6" }
          - { name: tape-grad-2,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "2/6" }
          - { name: tape-grad-3,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "3/6" }
          - { name: tape-grad-4,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "4/6" }
          - { name: tape-grad-5,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "5/6" }
          - { name: tape-grad-6,  filter: "FullyQualifiedName~Engines.OpParity.TapeGradientParityTests", shard: "6/6" }
    name: gpu-parity-pocl (${{ matrix.name }})
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Install POCL (CPU OpenCL device) + ICD loader
      run: |
        # Drop the third-party apt sources the runner image ships with, before updating.
        #
        # None of them provide the packages below - those come from the Ubuntu archives - but
        # `apt-get update` exits 100 if ANY configured source fails, and this step runs under
        # `bash -e`, so one unrelated mirror hiccup kills the shard before a single test runs.
        # That happened on run 34491921445: dl.google.com/linux/chrome-stable served a
        # Packages.gz whose size disagreed with its own Release file ("Mirror sync in progress"),
        # and tape-grad-6 went red on PR #1017 with nothing in its log but an apt error.
        #
        # Keep unrelated package mirrors out of device setup. The focused recurrence
        # shard requires a working device and passing tests; broad legacy shards
        # remain informational. Retry device discovery below, not numerical failures.
        #
        # Removed by name rather than globbing `*.list`, so a runner image that keeps the Ubuntu
        # archive in a `.list` file is not left with no sources at all. `rm -f` is a no-op when
        # they are absent.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list                    /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 ocl-icd-opencl-dev pocl-opencl-icd clinfo
        echo "=== clinfo: OpenCL platforms/devices ==="
        device_ready=0
        for attempt in 1 2 3; do
          if clinfo -l > /tmp/pocl-devices.txt && grep -q 'Device #' /tmp/pocl-devices.txt; then
            cat /tmp/pocl-devices.txt
            device_ready=1
            break
          fi
          sleep 2
        done
        if [ "$device_ready" -ne 1 ]; then
          if [ "${{ matrix.required }}" = "true" ]; then
            echo "::error::POCL device setup failed after three attempts."
            exit 1
          fi
          echo "::warning::POCL device setup failed after three attempts; this legacy shard is informational."
        fi

    - name: Build tests (net10.0)
      run: dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --framework net10.0

    - name: Run CPU-vs-GPU parity on POCL (shard ${{ matrix.name }})
      # The focused recurrence shard is required; broad legacy shards remain informational.
      continue-on-error: ${{ !matrix.required }}
      env:
        AIDOTNET_OPENCL_ALLOW_CPU: '1'
        AIDOTNET_REQUIRE_GPU_TESTS: '1'
        # Empty for the non-partitioned shards (unset => full set); "k/N" for the op-registry sub-shards.
        AIDOTNET_PARITY_SHARD: ${{ matrix.shard }}
        AIDOTNET_OPPARITY_REPORT_DIR: ${{ runner.temp }}/opparity
      run: |
        dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj \
          --configuration Release --no-build --framework net10.0 \
          --filter "(${{ matrix.filter }})&Category!=Benchmark&Category!=Performance" \
          --logger "trx;LogFilePath=${{ runner.temp }}/trx/${{ matrix.name }}.trx" \
          --blame-hang --blame-hang-timeout 600s --blame-crash \
          ${{ matrix.coverage && '--collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]AiDotNet.Tensors.Engines.DirectGpu.*,[*]AiDotNet.Tensors.Engines.DirectGpuTensorEngine*,[*]AiDotNet.Tensors.Engines.Cu*,[*]AiDotNet.Tensors.Engines.ClBlast*,[*]AiDotNet.Tensors.Engines.OpenCl*,[*]AiDotNet.Tensors.Engines.Simd.*,[*]AiDotNet.Tensors.Engines.BlasManaged.*"' || '' }}

    - name: Report skipped tests
      # A skip does not fail a build, so a shard can go green without running its tests: list every skip with its reason.
      if: always()
      run: python3 scripts/ci/summarize-test-skips.py --title "POCL ${{ matrix.name }}" "${{ runner.temp }}/trx/*.trx"

    - name: Upload device-path coverage to Codecov
      if: always() && matrix.coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/**/coverage.cobertura.xml
        disable_search: true
        flags: gpu-pocl
        name: gpu-pocl-${{ matrix.name }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload parity divergence report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: opparity-pocl-${{ matrix.name }}
        path: ${{ runner.temp }}/opparity/**
        if-no-files-found: ignore
