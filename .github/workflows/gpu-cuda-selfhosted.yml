name: GPU (CUDA, self-hosted)

# Why this lane exists (#1569)
# ----------------------------
# Hosted runners have no GPU, so every CUDA test skips there and CI goes green without running them. Two CUDA crash
# classes reached main that way (grid Y/Z overflow at batch 128 in ResNet-18 / VGG-11 inference; optimizer moments
# freed at the tape's end in MobileNetV2 training), and #1566 broke three CUDA tests unnoticed (#1570). This lane runs
# the GPU suites and AiDotNet's model families on a real NVIDIA GPU, and a test that skips here fails the lane unless
# its reason is an explicit exemption (another backend's device, an architecture requirement).
#
# To enable it, register a self-hosted runner on a machine with an NVIDIA GPU and the CUDA driver and a CUDA 13
# toolkit (its bin on the machine PATH, for NVRTC and cuBLAS), PowerShell 7 and Python 3 on the machine PATH; the job
# installs the .NET SDK and cuDNN into its workspace), with the labels `self-hosted, gpu, cuda`, then set the repository variable
# CUDA_RUNNER_ENABLED=true. Until the variable is set every job is skipped, so nothing waits for a runner that does
# not exist. Pull requests from forks never run here: a self-hosted runner must not execute untrusted code.
# The model families come from AiDotNet master's parity harness; the repository variable AIDOTNET_HARNESS_REF points
# the lane at another AiDotNet ref when a harness change needs testing before it merges.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/AiDotNet.Tensors/Engines/DirectGpu/**'
      - 'src/AiDotNet.Tensors/Engines/DirectGpuTensorEngine*.cs'
      - 'src/AiDotNet.Tensors/Engines/Gpu/**'
      # Shared paths that decide GPU residency and buffer lifetime: a CUDA regression there must surface before merge.
      - 'src/AiDotNet.Tensors/Engines/TensorScope.cs'
      - 'src/AiDotNet.Tensors/Engines/Autodiff/**'
      - 'src/AiDotNet.Tensors/LinearAlgebra/Tensor.cs'
      - 'src/AiDotNet.Tensors/LinearAlgebra/TensorStorage.cs'
      - 'src/AiDotNet.Tensors/Helpers/Autotune/**'
      - '.github/workflows/gpu-cuda-selfhosted.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Automatic selection takes CUDA only, so a backend-agnostic test or model run cannot silently land on OpenCL (which
  # NVIDIA's driver also provides); GpuLaneBackendTests fails the suite if the engine resolves anything else.
  AIDOTNET_DIRECTGPU_BACKENDS: cuda
  AIDOTNET_EXPECT_GPU_BACKEND: CUDA
  # Git for Windows' installer can enable core.fsmonitor machine-wide. On a runner, every git call actions/checkout makes
  # then starts an fsmonitor daemon that keeps checkout's temporary HOME open, and the step fails cleaning it up
  # (EBUSY: resource busy or locked, rmdir '_work\_temp\<guid>'). Turn it off for this job's git processes.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.fsmonitor
  GIT_CONFIG_VALUE_0: false
  # setup-dotnet installs into C:\Program Files\dotnet by default, which the runner's service account cannot write.
  # Install into the workspace instead (resolved against it; it persists between runs, so the SDK is fetched once).
  DOTNET_INSTALL_DIR: .dotnet
  # AIDOTNET_REQUIRE_GPU_TESTS is not set: it turns every backend's absence into a throw, and the suites include cases for
  # HIP, Metal, Vulkan and WebGPU this runner does not have. A missing CUDA device fails here through the skip check below
  # instead, whose exemptions name the other backends only.

jobs:
  cuda:
    if: >-
      ${{ vars.CUDA_RUNNER_ENABLED == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: AiDotNet.Tensors
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        # GA, not dotnet-quality 'preview': on the 10.0 channel that resolves to 10.0.100-rc.2, whose NuGet fails the
        # build with NU1510. Hosted runners mask this with the image's newer preinstalled SDK; this runner has none.
        dotnet-version: '10.0.x'

    # The skip check below is Python (standard library only); a runner without it would fail only after the tests.
    # Not actions/setup-python: its Windows installer edits HKLM, which a runner's service account cannot, so the
    # runner provides a Python 3 on PATH instead.
    - name: Check for Python
      run: |
        $python = Get-Command python -ErrorAction SilentlyContinue
        if (-not $python) { Write-Output "::error::This runner has no python on PATH; install Python 3 for all users."; exit 1 }
        "Python: $(python --version) at $($python.Source)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    # The PyTorch reference tests (nn.GRU parity on the CPU and on CUDA) call PARITY_PYTHON with numpy and torch. They
    # go into a virtual environment in the workspace, built once per pinned set and reused, since the service account
    # cannot install into the machine's Python. torch is the CPU build: the references run on the host.
    - name: Python packages
      run: |
        $pins = 'numpy==2.3.4', 'torch==2.9.0'
        $venv = Join-Path $env:GITHUB_WORKSPACE 'pyenv'
        $marker = Join-Path $venv ('ok-' + (($pins -join '_') -replace '[^A-Za-z0-9_.]', '-'))
        $py = Join-Path $venv 'Scripts\python.exe'
        if (-not (Test-Path $marker)) {
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Creating the Python virtual environment failed."; exit 1 }
          & $py -m pip install --disable-pip-version-check -q $pins --extra-index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Installing $($pins -join ', ') failed."; exit 1 }
          New-Item -ItemType File -Path $marker | Out-Null
        }
        "PARITY_PYTHON=$py" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
        "Python packages (numpy, torch): $(& $py -I -c 'import numpy, torch; print(numpy.__version__, torch.__version__)')" |
          Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Check out AiDotNet beside this checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ooples/AiDotNet
        # The parity harness's model families (ooples/AiDotNet#2381); AIDOTNET_HARNESS_REF overrides master.
        ref: ${{ vars.AIDOTNET_HARNESS_REF || 'master' }}
        path: aidn
        persist-credentials: false

    # Every family is required: the regressions this lane exists for were in ResNet-18 / VGG-11 inference at batch 128
    # and MobileNetV2 training. Checked first, so a lane enabled without a harness that defines them fails in its first
    # minute with the fix in the message, not after the GPU suites.
    - name: Check the AiDotNet harness defines every model family
      run: |
        $program = Get-Content aidn/benchmarks/AiDotNet.PyTorchParity/Program.cs -Raw
        $families = 'mlp','cnn','lstm','transformer','gru','resnet18','resnet50','vgg11','mobilenetv2','densenet121','vit'
        $missing = $families | Where-Object { $program -notmatch ('"' + $_ + '"\s*=>') }
        if ($missing) {
          Write-Output "::error::The AiDotNet parity harness at '${{ vars.AIDOTNET_HARNESS_REF || 'master' }}' does not define: $($missing -join ', '). Set the repository variable AIDOTNET_HARNESS_REF to a ref that does, or unset it to use master."
          exit 1
        }
        "MODEL_FAMILIES=$($families -join ',')" | Out-File -Append -FilePath $env:GITHUB_ENV
        "Model families: $($families -join ', ')" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Record the GPU and driver
      run: |
        $gpu = nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader
        if ($LASTEXITCODE -ne 0) { Write-Output "::error::nvidia-smi failed: this runner has no usable NVIDIA driver."; exit 1 }
        "Runner GPU: $gpu" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
        # The checked-in direct-PTX specializations are validated on GA10x (SM86) and admitted only there, so on another
        # architecture their tests skip by design. The exemption holds only when no visible GPU is SM86: on a runner
        # with one, whichever device the tests pick, such a skip still fails the lane (see the skip check).
        $caps = @($gpu | ForEach-Object { ($_ -split ',')[2].Trim() })
        if ($caps -notcontains '8.6') { "CUDA_ARCH_SKIP_ALLOW=|\bSM ?86\b" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV }

    # The cuDNN paths (convolution candidates, batch norm) need cudnn64_9.dll on the loader path, and the toolkit's
    # cuBLASLt for the CUDA it was built against: the CUDA 13 build pairs with a CUDA 13 toolkit's cublasLt64_13.dll.
    # NVIDIA's public redistributable is fetched once into the workspace (it persists between runs) and checked
    # against the SHA-256 in NVIDIA's own manifest.
    - name: cuDNN
      run: |
        $version = '9.26.1.1'
        $sha256 = 'c826d866641fed2c266ae1c11e679fcc1ef8517801a32a51715843051ce8df52'   # redistrib_9.26.1.json, windows-x86_64 cuda13
        $root = Join-Path $env:GITHUB_WORKSPACE "cudnn-$version"
        if (-not (Test-Path (Join-Path $root 'ok'))) {
          $zip = Join-Path $env:RUNNER_TEMP 'cudnn.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-${version}_cuda13-archive.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) { Write-Output "::error::cuDNN archive SHA-256 mismatch."; exit 1 }
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null
          # Windows' bsdtar by path: a runner whose PATH puts Git's GNU tar first reads "C:\..." as host "C" and fails
          # with "Cannot connect to C: resolve failed" (GNU tar also cannot open a .zip).
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $root
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Extracting cuDNN failed."; exit 1 }
          Remove-Item $zip
          New-Item -ItemType File (Join-Path $root 'ok') | Out-Null
        }
        $dll = Get-ChildItem $root -Recurse -Filter cudnn64_9.dll | Select-Object -First 1
        if (-not $dll) { Write-Output "::error::cudnn64_9.dll is not in the cuDNN archive."; exit 1 }
        $dll.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH
        "cuDNN: $version (CUDA 13) at $($dll.DirectoryName)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Build tests (net10.0)
      run: dotnet build AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --framework net10.0

    - name: GPU suites (DirectGpu, Autodiff, Compilation, Parity)
      env:
        # cuDNN's own error log, uploaded with the TRX. A cuDNN failure such as CUDNN_STATUS_EXECUTION_FAILED_CUDART
        # then names the CUDA runtime call that failed, which the exception does not.
        CUDNN_LOGERR_DBG: '1'
        CUDNN_LOGDEST_DBG: ${{ runner.temp }}/trx/cudnn-errors.log
      run: |
        New-Item -ItemType Directory -Force "${{ runner.temp }}/trx" | Out-Null
        dotnet test AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj `
          --configuration Release --no-build --framework net10.0 `
          --filter "(FullyQualifiedName~GpuLaneBackend|FullyQualifiedName~Engines.DirectGpu|FullyQualifiedName~Engines.Autodiff|FullyQualifiedName~Engines.Compilation|FullyQualifiedName~Parity|FullyQualifiedName~GruSequence|FullyQualifiedName~FusedConv2DBatchNorm)&Category!=Benchmark&Category!=Performance" `
          --results-directory "${{ runner.temp }}/trx" --logger "trx;LogFileName=cuda.trx" `
          --blame-hang --blame-hang-timeout 900s --blame-crash
      # With --blame the TRX logger ignores LogFilePath and writes under the project's TestResults; the results
      # directory puts the TRX and any crash or hang dump where the skip check and the upload look.

    - name: Fail on unexplained skips
      if: always()
      # Allowed skip reasons:
      #   - another backend's device or toolchain (this runner has CUDA, not necessarily HIP, Metal, Vulkan, WebGPU, or a
      #     Python with numpy and torch);
      #   - architecture requirements (an sm_ level, AVX-512 on the host CPU; on a runner other than SM86, the SM86-only
      #     specializations, via CUDA_ARCH_SKIP_ALLOW from the GPU step);
      #   - tracked baselines, each a listed gap with its own marker (NEEDS SPEC, TAPE-GRADIENT BASELINE, a forward with
      #     no differentiable leaf, the PTX transfer campaign's progress check);
      #   - opt-in benchmarks and probes, and wall-clock perf gates (they skip under CI=true);
      #   - "Not applicable: CUDA ...", a test of a mechanism CUDA deliberately does not use (it names CUDA's own).
      # Allowed test names: device classes of another backend (TorchParity*HipDeviceTests and the like), whose reasons say
      # only that no backend is available. A CUDA test skipping for any other reason fails the lane.
      run: >-
        python AiDotNet.Tensors/scripts/ci/summarize-test-skips.py --title "CUDA" --fail-on-skip
        --allowed-skip "(?i)(HIP|ROCm|Metal|MoltenVK|Vulkan|WebGPU|Dawn|AIDOTNET_WEBGPU_NODE_DIR|OpenCL|POCL|DirectML|macOS)|requires sm_|compute capability|torch|numpy|python|PARITY_PYTHON|AVX-512|^NEEDS SPEC:|TAPE-GRADIENT BASELINE|forward recorded no differentiable leaf|Full PTX transfer not complete|^Not applicable: CUDA |Requires a non-CUDA|benchmark|Wall-clock perf gate|run manually|manual perf harness|Manual CUDA|Diagnostic-only|Set (AIDOTNET|PARITY)_[A-Z0-9_]+=|AIDOTNET_GPU_MEMTRACK|AIDOTNET_KERNEL_REGISTRY_PERSIST${{ env.CUDA_ARCH_SKIP_ALLOW }}"
        --allowed-skip-test "(Hip|Rocm|Dawn|WebGpu|Vulkan|Metal|MoltenVk|OpenCl|Pocl|DirectMl)[A-Za-z0-9]*Tests\."
        "${{ runner.temp }}/trx/*.trx"


    - name: AiDotNet model families on CUDA (2 training steps, inference up to batch 128)
      # Builds AiDotNet against this checkout (UseLocalTensors resolves ../../AiDotNet.Tensors from aidn/src), so the
      # model families exercise exactly this commit's kernels; the families were checked at the start of the job.
      run: |
        # This checkout can need a newer AiDotNet.Evolution than AiDotNet master pins (Tensors 0.7.0 vs AiDotNet
        # 0.6.0 failed restore with NU1605, a package downgrade). Raise AiDotNet's central pin to this commit's version,
        # as a consumer upgrading Tensors would; a newer pin on AiDotNet's side is kept.
        $tensorsProj = Get-Content AiDotNet.Tensors/src/AiDotNet.Tensors/AiDotNet.Tensors.csproj -Raw
        $want = [regex]::Match($tensorsProj, '<PackageReference Include="AiDotNet\.Evolution" Version="([^"]+)"').Groups[1].Value
        $props = 'aidn/Directory.Packages.props'
        $text = Get-Content $props -Raw
        $pin = [regex]::Match($text, '(<PackageVersion Include="AiDotNet\.Evolution" Version=")([^"]+)(")')
        if (-not $want -or -not $pin.Success) { Write-Output "::error::Could not read the AiDotNet.Evolution version from Tensors or AiDotNet."; exit 1 }
        if ([version]$pin.Groups[2].Value -lt [version]$want) {
          Write-Output "AiDotNet.Evolution: AiDotNet pins $($pin.Groups[2].Value), this Tensors needs $want; using $want."
          Set-Content $props ($text.Remove($pin.Groups[2].Index, $pin.Groups[2].Length).Insert($pin.Groups[2].Index, $want)) -NoNewline
        }
        dotnet run -c Release --project aidn/benchmarks/AiDotNet.PyTorchParity -p:UseLocalTensors=true -- `
          --models $env:MODEL_FAMILIES --device cuda --epochs 1 --train-batches 2 --batch-size 64 `
          --inference-iterations 3 --warmup-iterations 1 --output "${{ runner.temp }}/aidotnet-cuda.json"
        if ($LASTEXITCODE -ne 0) { Write-Output "::error::An AiDotNet model family failed on CUDA."; exit 1 }

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gpu-cuda-results
        path: |
          ${{ runner.temp }}/trx/**
          ${{ runner.temp }}/aidotnet-cuda.json
        if-no-files-found: ignore
        # A crash dump is the full test host (gigabytes); keep it only long enough to analyse.
        retention-days: 5
