name: GPU (CUDA, self-hosted)

# Why this lane exists (#1569)
# ----------------------------
# Hosted runners have no GPU, so every CUDA test skips there and CI goes green without running them. Two CUDA crash
# classes reached main that way (grid Y/Z overflow at batch 128 in ResNet-18 / VGG-11 inference; optimizer moments
# freed at the tape's end in MobileNetV2 training), and #1566 broke three CUDA tests unnoticed (#1570). This lane runs
# the GPU suites and AiDotNet's model families on a real NVIDIA GPU, and a test that skips here fails the lane unless
# its reason is an explicit exemption (another backend's device, an architecture requirement).
#
# To enable it, register a self-hosted runner on a machine with an NVIDIA GPU and the CUDA driver and a CUDA 13
# toolkit (its bin on the machine PATH, for NVRTC and cuBLAS), PowerShell 7 and Python 3 on the machine PATH; the job
# installs the .NET SDK and cuDNN into its workspace), with the labels `self-hosted, gpu, cuda` plus its architecture label,
# `sm86` (RTX 30-series, the pull-request gate), `sm75` (GTX 16-series / RTX 20-series) or `sm89` (RTX 40-series / Ada; its
# job also needs the repository variable CUDA_SM89_RUNNER_ENABLED=true), then set the repository variable
# CUDA_RUNNER_ENABLED=true. A runner registered before the lane was split by architecture has only the first three labels and
# matches no job: add its architecture label (Settings > Actions > Runners > the runner > Labels, or re-run config.cmd with
# --labels self-hosted,gpu,cuda,sm86). Until the variable is set every job is skipped, so nothing waits for a runner that does
# not exist. Pull requests from forks never run here: a self-hosted runner must not execute untrusted code.
# A pull request's GPU suites run on any runner that also carries the label `cuda-pr` (the RTX 3080s and the RTX 1000
# Ada; not the GTX 1660 Ti, whose suites take about 3 hours), so a queue of pull requests is shared between them; its
# AiDotNet model families still need an `sm86` runner. Add `cuda-pr` to a runner fast enough for the pull-request budget.
# A run takes over an hour, so the lane skips draft pull requests and any
# pull request labelled `skip-gpu-ci` (for a change that cannot affect the GPU, such as comment-only edits to the
# paths below; a title rule would also skip a combined pull request that carries GPU work); the nightly schedule
# still covers main.
# The model families come from AiDotNet master's parity harness; the repository variable AIDOTNET_HARNESS_REF points
# the lane at another AiDotNet ref when a harness change needs testing before it merges.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      # The step-time ratchets run only after every earlier step passes, and the GPU suites alone can fill their
      # watchdog, so a dispatch could never reach them to record a baseline (#1703). ratchets_only builds the tests and
      # runs just the ratchet step on the RTX 3080: no GPU suites, torch interop host, skip gate or model families.
      ratchets_only:
        description: Run only the CUDA step-time ratchets on the RTX 3080 (skips the GPU suites and model families)
        type: boolean
        default: false
      # Narrows the ratchet step to matching tests (a FullyQualifiedName substring, e.g. Fp16 or Resnet18), so recording
      # one network's baseline does not hold the shared runner for every network's PyTorch compile.
      ratchet_filter:
        description: Optional FullyQualifiedName substring that narrows the ratchet tests (empty runs them all)
        type: string
        default: ''
      # Runs one architecture's job alone (for example to exercise a newly registered runner) instead of all of them.
      arch:
        description: Run only this architecture's job (all runs every architecture the nightly schedule runs)
        type: choice
        options: [all, sm86, sm75, sm89]
        default: all
  # Pull requests run this workflow through ci.yml, as one job of the pull request's single CI run, when ci.yml's
  # changes job finds a file matching its path filter (cuda in .github/ci-path-filters.yml). Pushes to main do not
  # run it: the nightly schedule covers main.
  workflow_call:

concurrency:
  # Pull-request runs share a group per ref; any other run (a push to main, a schedule) gets its own, so main
  # runs never cancel or replace one another and every push to main produces its results and coverage.
  group: gpu-cuda-selfhosted-${{ (github.event_name == 'pull_request' && github.ref || github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Automatic selection takes CUDA only, so a backend-agnostic test or model run cannot silently land on OpenCL (which
  # NVIDIA's driver also provides); GpuLaneBackendTests fails the suite if the engine resolves anything else.
  AIDOTNET_DIRECTGPU_BACKENDS: cuda
  AIDOTNET_EXPECT_GPU_BACKEND: CUDA
  # Git for Windows' installer can enable core.fsmonitor machine-wide. On a runner, every git call actions/checkout makes
  # then starts an fsmonitor daemon that keeps checkout's temporary HOME open, and the step fails cleaning it up
  # (EBUSY: resource busy or locked, rmdir '_work\_temp\<guid>'). Turn it off for this job's git processes.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.fsmonitor
  GIT_CONFIG_VALUE_0: false
  # setup-dotnet installs into C:\Program Files\dotnet by default, which the runner's service account cannot write.
  # Install into the workspace instead (resolved against it; it persists between runs, so the SDK is fetched once).
  DOTNET_INSTALL_DIR: .dotnet
  # AIDOTNET_REQUIRE_GPU_TESTS is not set: it turns every backend's absence into a throw, and the suites include cases for
  # HIP, Metal, Vulkan and WebGPU this runner does not have. A missing CUDA device fails here through the skip check below
  # instead, whose exemptions name the other backends only.

jobs:
  cuda:
    if: >-
      ${{ vars.CUDA_RUNNER_ENABLED == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft &&
            !contains(github.event.pull_request.labels.*.name, 'skip-gpu-ci'))) }}
    # Nightly and on dispatch: one job per runner architecture, chosen by the runner's sm label. The SM86 job is the full
    # lane (GPU suites, AiDotNet model families, step-time ratchets; its check keeps the name "cuda"). The SM75 job (a
    # GTX 1660 Ti, about 3 hours) and the SM89 job (an RTX 1000 Ada laptop GPU) run the same GPU suites, where the
    # GA10x/SM86-only specializations skip by design, and leave the model families to SM86: they need its memory. The
    # SM89 job exists only while the repository variable CUDA_SM89_RUNNER_ENABLED is true: its runner is a laptop that is
    # not always on, and a job waiting for an absent runner would hold the nightly run for a day and then fail it.
    # Pull requests: two jobs. "pr" runs the GPU suites on whichever runner labelled cuda-pr is free (check name "cuda"),
    # so the RTX 3080s and the Ada share the queue; "pr-models" runs the model families on an SM86 runner (check name
    # "cuda-models"). The "pr" job reads its architecture from the GPU it landed on (steps.gpu.outputs.sm) for the
    # SM86-only skip exemption and the watchdog. The per-architecture settings are derived from matrix.arch: matrix
    # `include` entries cannot be used for them, because an entry left with no combination to extend is added as a new
    # job, which would bring the SM75 job back on pull requests.
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["pr","pr-models"]' || inputs.ratchets_only && '["sm86"]' || (inputs.arch && inputs.arch != 'all') && format('["{0}"]', inputs.arch) || (vars.CUDA_SM89_RUNNER_ENABLED == 'true' && '["sm86","sm75","sm89"]' || '["sm86","sm75"]')) }}
    name: ${{ (matrix.arch == 'sm86' || matrix.arch == 'pr') && 'cuda' || matrix.arch == 'pr-models' && 'cuda-models' || format('cuda-{0}', matrix.arch) }}
    # Each runner needs self-hosted, gpu, cuda AND its architecture label (sm86, sm75 or sm89), plus cuda-pr to take pull
    # requests' GPU suites; a runner registered before the split carries no architecture label and picks up no job until
    # relabelled (see the header for how).
    runs-on: ${{ fromJSON(matrix.arch == 'pr' && '["self-hosted","gpu","cuda","cuda-pr"]' || matrix.arch == 'pr-models' && '["self-hosted","gpu","cuda","sm86"]' || format('["self-hosted","gpu","cuda","{0}"]', matrix.arch)) }}
    # pr and sm75/sm89: setup (up to 20 minutes), both suite parts at their full watchdogs with the diagnostics between
    # them (about 5 minutes), and the 30-minute reserve: 20 + 140 + 5 + 90 + 30 = 285 on the slowest cuda-pr runner,
    # 270 elsewhere. A DirectGpu overrun then still leaves the second part its whole watchdog, so it keeps its TRX.
    # pr-models: setup and the model families (about 18 minutes, bounded at 26).
    # sm86: setup (20), the suite parts (115 + 50) with diagnostics (5), torch interop (5), the model families (26) and
    # the nightly ratchet (360): 581, so 600.
    timeout-minutes: ${{ (matrix.arch == 'pr' || matrix.arch == 'sm75' || matrix.arch == 'sm89') && 290 || matrix.arch == 'pr-models' && 60 || 600 }}
    env:
      # The tests this lane runs. It selects by name, so a GPU test outside these terms never runs on CUDA; the
      # coverage check below fails the lane when a test class that drives the GPU engine is not selected. A term
      # ending in "." matches one class. Folding joins the lines with spaces; the steps strip them. The CUDA head-to-head
      # benchmarks (HeadToHeadGpuNetworkTests) stay out: each torch.compiles the network in every mode for up to an hour
      # with no test finishing, so the 15-minute hang blame killed the host. They run through tools/parity/run-gpu.ps1.
      # The rest of their categories stay in, among them the transfer-count residency ratchets.
      CUDA_LANE_FILTER: >-
        (FullyQualifiedName~GpuLaneBackend|
        FullyQualifiedName~Engines.DirectGpu|
        FullyQualifiedName~Engines.Autodiff|
        FullyQualifiedName~Engines.Compilation|
          FullyQualifiedName~.ConvTransposeOutputPaddingBackwardTests.|
        FullyQualifiedName~Parity|
        FullyQualifiedName~GruSequence|
        FullyQualifiedName~FusedConv2DBatchNorm|
        FullyQualifiedName~Engines.Gpu.|
        FullyQualifiedName~Engines.Codegen.|
        FullyQualifiedName~Engines.DevicePrimitives.|
        FullyQualifiedName~.DeferredScopeReproTests.|
        FullyQualifiedName~.CpuResidentDoublePrecisionTests.|
        FullyQualifiedName~.GroupNormIntoTests.|
        FullyQualifiedName~.LstmFinalStateGradientTests.|
        FullyQualifiedName~.LstmGateKernelTests.|
        FullyQualifiedName~.ResidentWeightInvalidationDeviceStateTests.|
        FullyQualifiedName~.CpuDoubleReductionTests.|
        FullyQualifiedName~.GpuEngineScalarReductionDispatchTests.|
        FullyQualifiedName~.SoftmaxForwardGpuReproTests.|
        FullyQualifiedName~.TimeStretchStageDiffTests.|
        FullyQualifiedName~.EmptyBroadcastTests.|
        FullyQualifiedName~.MixtureOfExpertsTests.|
        FullyQualifiedName~.DeviceResultRegistryTests.|
        FullyQualifiedName~.GpuPinnedLifetimeTests.|
        FullyQualifiedName~.Interop.DLPack|
        FullyQualifiedName~.EmptyBroadcastGpuTests.|
        FullyQualifiedName~.GridSampleBackwardAlignCornersTests.|
        FullyQualifiedName~.DirectGpuLinalgRoutingTests.|
        FullyQualifiedName~.StreamingTensorJournalTests.|
        FullyQualifiedName~.TensorCowInferenceReadPathTests.|
        FullyQualifiedName~.TensorAddActivationTests.|
        FullyQualifiedName~.TensorGpuCachePhysicalTests.)&Category!=Benchmark&Category!=Performance&Category!=RequiresOpenCL&
        FullyQualifiedName!~.HeadToHeadGpuNetworkTests.
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: AiDotNet.Tensors
        persist-credentials: false

    # First, so every step can read the architecture of the GPU the job landed on: a pull request's "pr" job runs on
    # whichever cuda-pr runner is free (outputs.sm is sm86 on an RTX 3080, sm89 on the Ada).
    - name: Record the GPU and driver
      id: gpu
      run: |
        $gpu = nvidia-smi --query-gpu=name,driver_version,compute_cap,memory.total --format=csv,noheader
        if ($LASTEXITCODE -ne 0) { Write-Output "::error::nvidia-smi failed: this runner has no usable NVIDIA driver."; exit 1 }
        "Runner GPU: $gpu" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
        $cap = "$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | Select-Object -First 1)".Trim()
        if ($cap -notmatch '^\d+\.\d+$') { Write-Output "::error::nvidia-smi reported no compute capability ('$cap')."; exit 1 }
        "sm=sm$($cap -replace '\.', '')" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        # GA, not dotnet-quality 'preview': on the 10.0 channel that resolves to 10.0.100-rc.2, whose NuGet fails the
        # build with NU1510. Hosted runners mask this with the image's newer preinstalled SDK; this runner has none.
        dotnet-version: '10.0.x'

    # The skip check below is Python (standard library only); a runner without it would fail only after the tests.
    # Not actions/setup-python: its Windows installer edits HKLM, which a runner's service account cannot, so the
    # runner provides a Python 3 on PATH instead.
    - name: Check for Python
      run: |
        $python = Get-Command python -ErrorAction SilentlyContinue
        if (-not $python) { Write-Output "::error::This runner has no python on PATH; install Python 3 for all users."; exit 1 }
        "Python: $(python --version) at $($python.Source)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    # The PyTorch reference tests (nn.GRU parity, the caching-allocator comparison) call PARITY_PYTHON with numpy and
    # torch, and the DLPack round trips embed AIDOTNET_TORCH_PYTHON. They go into a virtual environment in the
    # workspace, built once per pinned set and wheel index and reused, since the service account cannot install into
    # the machine's Python. torch is the CUDA build: the allocator comparison and the CUDA DLPack round trips need a
    # device, and AIDOTNET_REQUIRE_TORCH_CUDA makes a torch that cannot reach one fail instead of skip.
    # The venv is built from Python 3.13, not the machine's python: torch 2.9's torch.compile refuses Python 3.14+
    # ("torch.compile is not supported on Python 3.14+"), so on a 3.14 runner every step-time ratchet deferred with no
    # compiled PyTorch mode measured (#1703). The launcher's 3.13 is used when installed; otherwise uv (installed into
    # the workspace, no admin needed) downloads a 3.13 into the workspace once. triton-windows is torch.compile's CUDA
    # backend on Windows; 3.5.x is the line built for torch 2.9.
    - name: Python packages
      if: matrix.arch != 'pr-models'
      run: |
        $pins = 'numpy==2.3.4', 'torch==2.9.0', 'triton-windows<3.6'
        $index = 'https://download.pytorch.org/whl/cu128'
        $pythonVersion = '3.13'
        $venv = Join-Path $env:GITHUB_WORKSPACE 'pyenv'
        $marker = Join-Path $venv ('ok-' + ((($pins + (Split-Path $index -Leaf) + "py$pythonVersion") -join '_') -replace '[^A-Za-z0-9_.]', '-'))
        $py = Join-Path $venv 'Scripts\python.exe'
        if (-not (Test-Path $marker)) {
          $base = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $found = & py "-$pythonVersion" -c 'import sys; print(sys.executable)' 2>$null
            if ($LASTEXITCODE -eq 0 -and $found) { $base = "$found".Trim() }
          }
          if (-not $base) {
            $uvRoot = Join-Path $env:GITHUB_WORKSPACE 'uv'
            $uvVenv = Join-Path $uvRoot 'tool'
            $uv = Join-Path $uvVenv 'Scripts\uv.exe'
            if (-not (Test-Path $uv)) {
              python -m venv $uvVenv
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::Creating the uv tool environment failed."; exit 1 }
              & (Join-Path $uvVenv 'Scripts\python.exe') -m pip install --disable-pip-version-check -q uv
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::Installing uv failed."; exit 1 }
            }
            $env:UV_PYTHON_INSTALL_DIR = Join-Path $uvRoot 'python'
            & $uv python install $pythonVersion
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::uv could not install Python $pythonVersion."; exit 1 }
            $base = "$(& $uv python find $pythonVersion)".Trim()
            if ($LASTEXITCODE -ne 0 -or -not $base) { Write-Output "::error::uv installed Python $pythonVersion but cannot find it."; exit 1 }
          }
          Write-Output "Building the venv from $base"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          & $base -m venv $venv
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Creating the Python virtual environment failed."; exit 1 }
          & $py -m pip install --disable-pip-version-check -q $pins --extra-index-url $index
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Installing $($pins -join ', ') failed."; exit 1 }
          New-Item -ItemType File -Path $marker | Out-Null
        }
        $cuda = & $py -I -c 'import torch; print(torch.cuda.is_available())'
        if ($cuda -ne 'True') { Write-Output "::error::The CUDA build of torch cannot reach a device here (is_available: $cuda)."; exit 1 }
        # torch.compile's default cache is under the service account's temp folder
        # (C:\WINDOWS\ServiceProfiles\NetworkService\AppData\Local\Temp\torchinductor_<user>), and a Triton kernel's
        # files nest a 52-character hash, a temp folder and the fused kernel's name below it: past MAX_PATH, so every
        # compile mode failed with FileNotFoundError and the ratchets deferred (run 42876141146). A short root on the
        # work drive keeps them inside the limit, and persists the compiled kernels across runs.
        $compileCache = "$(Split-Path -Qualifier $env:RUNNER_TEMP)\ti"
        New-Item -ItemType Directory -Force -Path "$compileCache\triton" | Out-Null
        "PARITY_PYTHON=$py", "AIDOTNET_TORCH_PYTHON=$py", 'AIDOTNET_REQUIRE_TORCH_CUDA=1',
          "TORCHINDUCTOR_CACHE_DIR=$compileCache", "TRITON_CACHE_DIR=$compileCache\triton" |
          Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
        "Python packages (python, numpy, torch, cuda): $(& $py -I -c 'import sys, numpy, torch; print(sys.version.split()[0], numpy.__version__, torch.__version__, torch.version.cuda)')" |
          Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    # The harness steps below serve only the model-family step, which runs on SM86 (the nightly SM86 job and a pull
    # request's pr-models job); every other job skips them.
    - name: Check out AiDotNet beside this checkout
      if: (matrix.arch == 'sm86' || matrix.arch == 'pr-models') && !inputs.ratchets_only
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ooples/AiDotNet
        # The parity harness's model families (ooples/AiDotNet#2381); AIDOTNET_HARNESS_REF overrides master.
        ref: ${{ vars.AIDOTNET_HARNESS_REF || 'master' }}
        path: aidn
        persist-credentials: false

    # Every family is required: the regressions this lane exists for were in ResNet-18 / VGG-11 inference at batch 128
    # and MobileNetV2 training. Checked first, so a lane enabled without a harness that defines them fails in its first
    # minute with the fix in the message, not after the GPU suites.
    - name: Check the AiDotNet harness defines every model family
      if: (matrix.arch == 'sm86' || matrix.arch == 'pr-models') && !inputs.ratchets_only
      run: |
        $program = Get-Content aidn/benchmarks/AiDotNet.PyTorchParity/Program.cs -Raw
        $families = 'mlp','cnn','lstm','transformer','gru','resnet18','resnet50','vgg11','mobilenetv2','densenet121','vit'
        $missing = $families | Where-Object { $program -notmatch ('"' + $_ + '"\s*=>') }
        if ($missing) {
          Write-Output "::error::The AiDotNet parity harness at '${{ vars.AIDOTNET_HARNESS_REF || 'master' }}' does not define: $($missing -join ', '). Set the repository variable AIDOTNET_HARNESS_REF to a ref that does, or unset it to use master."
          exit 1
        }
        "MODEL_FAMILIES=$($families -join ',')" | Out-File -Append -FilePath $env:GITHUB_ENV
        "Model families: $($families -join ', ')" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    # The cuDNN paths (convolution candidates, batch norm) need cudnn64_9.dll on the loader path, and the toolkit's
    # cuBLASLt for the CUDA it was built against: the CUDA 13 build pairs with a CUDA 13 toolkit's cublasLt64_13.dll.
    # NVIDIA's public redistributable is fetched once into the workspace (it persists between runs) and checked
    # against the SHA-256 in NVIDIA's own manifest.
    - name: cuDNN
      run: |
        $version = '9.26.1.1'
        $sha256 = 'c826d866641fed2c266ae1c11e679fcc1ef8517801a32a51715843051ce8df52'   # redistrib_9.26.1.json, windows-x86_64 cuda13
        $root = Join-Path $env:GITHUB_WORKSPACE "cudnn-$version"
        if (-not (Test-Path (Join-Path $root 'ok'))) {
          $zip = Join-Path $env:RUNNER_TEMP 'cudnn.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-${version}_cuda13-archive.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) { Write-Output "::error::cuDNN archive SHA-256 mismatch."; exit 1 }
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null
          # Windows' bsdtar by path: a runner whose PATH puts Git's GNU tar first reads "C:\..." as host "C" and fails
          # with "Cannot connect to C: resolve failed" (GNU tar also cannot open a .zip).
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $root
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Extracting cuDNN failed."; exit 1 }
          Remove-Item $zip
          New-Item -ItemType File (Join-Path $root 'ok') | Out-Null
        }
        $dll = Get-ChildItem $root -Recurse -Filter cudnn64_9.dll | Select-Object -First 1
        if (-not $dll) { Write-Output "::error::cudnn64_9.dll is not in the cuDNN archive."; exit 1 }
        $dll.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH
        "cuDNN: $version (CUDA 13) at $($dll.DirectoryName)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Check the lane selects every GPU test class
      if: ${{ !inputs.ratchets_only && matrix.arch != 'pr-models' }}
      run: python AiDotNet.Tensors/scripts/ci/check-cuda-lane-coverage.py --filter ($env:CUDA_LANE_FILTER -replace "\s", "") AiDotNet.Tensors/tests

    - name: Build tests (net10.0)
      if: matrix.arch != 'pr-models'
      run: dotnet build AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --framework net10.0

    - name: GPU suites (DirectGpu, then Autodiff, Compilation, Parity and the rest)
      if: ${{ !inputs.ratchets_only && matrix.arch != 'pr-models' }}
      env:
        # cuDNN's own error log, uploaded with the TRX. A cuDNN failure such as CUDNN_STATUS_EXECUTION_FAILED_CUDART
        # then names the CUDA runtime call that failed, which the exception does not.
        CUDNN_LOGERR_DBG: '1'
        CUDNN_LOGDEST_DBG: ${{ runner.temp }}/trx/cudnn-errors.log
        # Blame dumps a test host only when no test starts or finishes for 15 minutes. Two runs on 2026-11-08 sat in
        # this step past two hours without it firing, and the job timeout then cancelled the job, which skips the
        # failure-only stack step below. The watchdog bounds the step instead: past the limit it prints each test
        # host's managed stacks and the processes under the runner, then fails the step so the steps below still run.
        # Passing SM86 runs take 78 to 101 minutes here; the SM75 suites take about 3 hours. The reserve also covers the
        # steps after the suites on a pull request: the torch interop step (at most 5 minutes), the model families
        # (about 18, bounded at 26) and the upload. The deadline counts from
        # the job's start (the runner worker's), not this step's, and stops DIAGNOSTICS_RESERVE_MINUTES short of the job
        # limit, so slow setup cannot let the job timeout cancel the step before the watchdog fires.
        # A pull request's suites ("pr") run where they land; the model families run in their own job there.
        # The suites run as two test hosts, each with its own watchdog and TRX, so a part that overruns still leaves
        # the other's per-test results (2026-11-11/12: the single 120-minute run hit its watchdog on main and on #1718
        # with no other process on the GPU, and left no TRX to say which tests had grown). The last passing SM86 run
        # (2026-11-08, 78 minutes) spent 70 test-minutes in Engines.DirectGpu and 44 in the rest; split on 2026-11-12 they
        # took 93 and 34 minutes. On an RTX 3080 the parts get 115 and 50 minutes; on a slower cuda-pr runner 140 and
        # 90, and elsewhere 130 and 85. The job limit (timeout-minutes above) is sized so both parts fit at their full
        # watchdogs after setup; the job limit less the reserve still caps each part's deadline.
        SUITE_WATCHDOG_DIRECTGPU_MINUTES: ${{ (matrix.arch == 'sm86' || (matrix.arch == 'pr' && steps.gpu.outputs.sm == 'sm86')) && '115' || matrix.arch == 'pr' && '140' || '130' }}
        SUITE_WATCHDOG_REST_MINUTES: ${{ (matrix.arch == 'sm86' || (matrix.arch == 'pr' && steps.gpu.outputs.sm == 'sm86')) && '50' || matrix.arch == 'pr' && '90' || '85' }}
        # Must equal the job's timeout-minutes.
        JOB_LIMIT_MINUTES: ${{ (matrix.arch == 'pr' || matrix.arch == 'sm75' || matrix.arch == 'sm89') && 290 || 600 }}
        DIAGNOSTICS_RESERVE_MINUTES: '30'
      run: |
        New-Item -ItemType Directory -Force "${{ runner.temp }}/trx" | Out-Null
        # The embedded-torch class runs in its own test host (the next step). The two parts partition the lane's
        # filter: & binds tighter than |, and the lane filter is one parenthesized group, so each part is the group
        # AND its own term.
        $filter = ($env:CUDA_LANE_FILTER -replace "\s", "") + '&FullyQualifiedName!~.DLPackTorchInteropTests.'
        $parts = @(
          @{ Name = 'Engines.DirectGpu'; Filter = "$filter&FullyQualifiedName~Engines.DirectGpu"; Trx = 'cuda.trx'
             Minutes = [int]$env:SUITE_WATCHDOG_DIRECTGPU_MINUTES },
          @{ Name = 'Autodiff, Compilation, Parity and the rest'; Filter = "$filter&FullyQualifiedName!~Engines.DirectGpu"
             Trx = 'cuda-rest.trx'; Minutes = [int]$env:SUITE_WATCHDOG_REST_MINUTES })

        # The worker process starts with the job; fall back to this step's start if the parent is not the worker.
        $self = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
        $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($self.ParentProcessId)"
        $jobStart = if ($parent -and $parent.Name -like 'Runner.Worker*') { $parent.CreationDate } else { $self.CreationDate }
        $jobDeadline = $jobStart.AddMinutes([int]$env:JOB_LIMIT_MINUTES - [int]$env:DIAGNOSTICS_RESERVE_MINUTES)

        # The same suites took 69 to 96 minutes on some nights and passed the 120-minute watchdog on others. On
        # 2026-11-08 the GPU tests ran up to 2.6x slower than on 2026-11-06 for the first 40 minutes only, the CPU-only
        # tests 1.12x, with no other job on the runner, so the extra load came from outside the run. nvidia-smi samples
        # the GPU every 30 seconds into the uploaded results: the processes holding a CUDA context, and the GPU's
        # utilization, SM clock, temperature, power and clock-event (throttle) reasons. A slow run then shows whether
        # another workload shared the GPU or the clocks dropped. Newer drivers name the reasons field
        # clocks_event_reasons; older ones only accept clocks_throttle_reasons.
        $samples = "${{ runner.temp }}/trx"
        $reasons = 'clocks_event_reasons.active'
        nvidia-smi --query-gpu=$reasons --format=csv,noheader 2>&1 | Out-Null
        if ($LASTEXITCODE -ne 0) { $reasons = 'clocks_throttle_reasons.active' }
        $gpuFields = "timestamp,utilization.gpu,memory.used,clocks.sm,clocks.max.sm,temperature.gpu,power.draw,$reasons"
        $samplers = @(
          (Start-Process nvidia-smi -ArgumentList "--query-gpu=$gpuFields --format=csv -l 30 -f `"$samples/gpu-samples.csv`"" -NoNewWindow -PassThru),
          (Start-Process nvidia-smi -ArgumentList "--query-compute-apps=timestamp,pid,process_name,used_memory --format=csv -l 30 -f `"$samples/gpu-processes.csv`"" -NoNewWindow -PassThru))
        # This run's processes: the tree under dotnet test, walked at every wait slice so the sampled process ids can be
        # told apart from another workload's, which may also be a dotnet or a testhost. Ids, parents and names only (a
        # command line could carry a credential).
        $ownIds = @{}
        function Update-RunTree {
          $all = @(Get-CimInstance Win32_Process)
          $tree = @{ [uint32]$run.Id = $true }
          do {
            $added = 0
            foreach ($p in $all) {
              if ($tree.ContainsKey([uint32]$p.ParentProcessId) -and -not $tree.ContainsKey([uint32]$p.ProcessId)) {
                $tree[[uint32]$p.ProcessId] = $true; $added++
              }
            }
          } while ($added -gt 0)
          foreach ($id in $tree.Keys) { $ownIds[$id] = $true }
          return @($all | Where-Object { $tree.ContainsKey([uint32]$_.ProcessId) })
        }
        function Stop-GpuSampling {
          foreach ($sampler in $samplers) { Stop-Process -Id $sampler.Id -Force -ErrorAction SilentlyContinue }
          # The process query is its own sampler, so it is read whether or not the GPU query recorded anything. A missing
          # or unreadable file means the check did not run, which is not the same as no other process.
          $processFile = "$samples/gpu-processes.csv"
          $apps = $null
          if (Test-Path $processFile) {
            try { $apps = @(Import-Csv $processFile -ErrorAction Stop) }
            catch { Write-Output "::warning::gpu-processes.csv could not be read; no check for other processes on the GPU." }
          } else {
            Write-Output "::warning::nvidia-smi recorded no process samples; no check for other processes on the GPU."
          }
          if ($null -ne $apps) {
            $others = @($apps | ForEach-Object {
              $idColumn = $_.PSObject.Properties | Where-Object { $_.Name.Trim() -eq 'pid' } | Select-Object -First 1
              $nameColumn = $_.PSObject.Properties | Where-Object { $_.Name.Trim() -eq 'process_name' } | Select-Object -First 1
              # A short row (nvidia-smi on a WDDM laptop GPU can print one) leaves a column's value null, so each value is
              # read as a string before trimming.
              $id = [uint32]0
              if ($idColumn -and [uint32]::TryParse("$($idColumn.Value)".Trim(), [ref]$id) -and -not $ownIds.ContainsKey($id)) {
                $rawName = if ($nameColumn) { "$($nameColumn.Value)".Trim() } else { '' }
                $name = if ($rawName) { Split-Path -Leaf $rawName } else { 'unknown' }
                "$name ($id)"
              } } | Sort-Object -Unique)
            if ($others.Count -gt 0) {
              Write-Output "::warning::Other processes held a CUDA context on this GPU during the suites: $($others -join ', ')."
            }
          }

          # Import-Csv throws on a missing file whatever its -ErrorAction, and the step runs with ErrorActionPreference
          # stop: an absent sample file must not fail the step before it reports the suites' exit code.
          $rows = @()
          if (Test-Path "$samples/gpu-samples.csv") {
            try { $rows = @(Import-Csv "$samples/gpu-samples.csv" -ErrorAction Stop) } catch { $rows = @() }
          }
          if ($rows.Count -eq 0) { Write-Output "::warning::nvidia-smi recorded no GPU samples."; return }
          # Columns carry their unit ("clocks.current.sm [MHz]"); the value is the number before the unit.
          function Read-Number($row, $prefix) {
            $column = $row.PSObject.Properties | Where-Object { $_.Name.Trim() -like "$prefix*" } | Select-Object -First 1
            $value = 0.0
            # The row nvidia-smi was writing when it was stopped can be cut short, leaving later columns null.
            if ($column -and $null -ne $column.Value -and [double]::TryParse(($column.Value.Trim() -split ' ')[0], [ref]$value)) { return $value }
            return $null
          }
          $clocks = @($rows | ForEach-Object { Read-Number $_ 'clocks.current.sm' } | Where-Object { $null -ne $_ })
          $temps = @($rows | ForEach-Object { Read-Number $_ 'temperature.gpu' } | Where-Object { $null -ne $_ })
          $maxClock = Read-Number $rows[0] 'clocks.max.sm'
          # 0x1 is GPU idle; any other bit (power cap, thermal, HW slowdown, applications clocks) lowered the clocks.
          $limited = @($rows | Where-Object {
            $column = $_.PSObject.Properties | Where-Object { $_.Name.Trim() -like 'clocks_*reasons*' } | Select-Object -First 1
            $bits = [uint64]0
            $column -and $null -ne $column.Value -and [uint64]::TryParse(($column.Value.Trim() -replace '^0x', ''),
              [Globalization.NumberStyles]::HexNumber, [Globalization.CultureInfo]::InvariantCulture, [ref]$bits) -and
              ($bits -shr 1) -ne 0 }).Count
          $line = "GPU samples: $($rows.Count); SM clock $(($clocks | Measure-Object -Minimum).Minimum)-" +
            "$(($clocks | Measure-Object -Maximum).Maximum) of $maxClock MHz; peak $(($temps | Measure-Object -Maximum).Maximum) C; " +
            "$limited samples with a clock-lowering reason."
          $line | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
        }

        $exitCode = 0
        # Sampling stops however the loop ends, so the summary and the sample files are always written.
        try {
          foreach ($part in $parts) {
            $testArgs = 'test AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj ' +
              '--configuration Release --no-build --framework net10.0 ' +
              "--filter `"$($part.Filter)`" " +
              "--results-directory `"${{ runner.temp }}/trx`" --logger `"trx;LogFileName=$($part.Trx)`" " +
              '--blame-hang --blame-hang-timeout 900s --blame-crash'
            $deadline = (Get-Date).AddMinutes($part.Minutes)
            if ($jobDeadline -lt $deadline) { $deadline = $jobDeadline }
            Write-Output "GPU suites, $($part.Name): watchdog deadline $($deadline.ToUniversalTime().ToString('u')) (job started $($jobStart.ToUniversalTime().ToString('u')))."

            $run = Start-Process dotnet -ArgumentList $testArgs -NoNewWindow -PassThru
            $null = $run.Handle   # cache the handle so ExitCode is readable after the process exits
            # Wait in 30-second slices (the sampling interval), recording the run's processes at each.
            $finished = $false
            while ($true) {
              $null = Update-RunTree
              $waitMs = [Math]::Max(0, [int]($deadline - (Get-Date)).TotalMilliseconds)
              if ($run.WaitForExit([Math]::Min($waitMs, 30000))) { $finished = $true; break }
              if ($waitMs -le 30000) { break }
            }
            if ($finished) {
              if ($run.ExitCode -ne 0) { $exitCode = $run.ExitCode }
              continue
            }

            Write-Output "::error::The GPU suites ($($part.Name)) were still running at the watchdog deadline."
            $exitCode = 1
            try {
              # Only this run's processes, so another workload's test host on the runner is never inspected.
              $mine = Update-RunTree
              Write-Output "::group::Processes of this run"
              $mine | Format-Table ProcessId, ParentProcessId, Name, CreationDate -AutoSize | Out-String -Width 200
              Write-Output "::endgroup::"

              # Each diagnostic is bounded, so a stalled install or attach cannot spend the reserve.
              $tools = "${{ runner.temp }}/dotnet-stack"
              if (-not (Test-Path "$tools/dotnet-stack*")) {
                $install = Start-Process dotnet -ArgumentList "tool install dotnet-stack --tool-path `"$tools`"" -NoNewWindow -PassThru
                if (-not $install.WaitForExit(180000)) {
                  Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
                  Write-Output "::warning::dotnet-stack did not install within 3 minutes; no stacks printed."
                }
              }
              if (Test-Path "$tools/dotnet-stack*") {
                foreach ($testHost in @($mine | Where-Object { $_.Name -like 'testhost*' })) {
                  Write-Output "::group::Managed stacks of testhost $($testHost.ProcessId)"
                  $report = Start-Process "$tools/dotnet-stack" -ArgumentList "report -p $($testHost.ProcessId)" -NoNewWindow -PassThru
                  if (-not $report.WaitForExit(120000)) {
                    Stop-Process -Id $report.Id -Force -ErrorAction SilentlyContinue
                    Write-Output "::warning::dotnet-stack did not finish within 2 minutes on $($testHost.ProcessId)."
                  }
                  Write-Output "::endgroup::"
                }
              }
            } catch {
              # A diagnostic that cannot start must not end the script: the next part still runs.
              Write-Output "::warning::GPU suites ($($part.Name)) diagnostics failed: $($_.Exception.Message)"
            } finally {
              taskkill /T /F /PID $run.Id | Out-Null
            }
            # Past the job's own deadline there is no time left for another part.
            if ((Get-Date) -ge $jobDeadline) {
              Write-Output "::error::The job deadline passed; the remaining GPU suite parts did not run."
              break
            }
          }
        } finally {
          Stop-GpuSampling
        }
        exit $exitCode
      # With --blame the TRX logger ignores LogFilePath and writes under the project's TestResults; the results
      # directory puts the TRX and any crash or hang dump where the skip check and the upload look.

    # DLPackTorchInteropTests embeds CPython and imports torch in the test host. The CUDA torch wheel ships its own
    # cuDNN 9 (a CUDA 12 build) under the same DLL names as the cuDNN 9.26 above; in a host whose GPU tests had loaded
    # ours first, torch's cudnn_cnn64_9.dll bound to our modules and failed with WinError 127, so every test of the
    # class failed. In a host of its own, torch is imported before the class creates an engine.
    - name: Embedded torch interop (own test host)
      if: ${{ !cancelled() && !inputs.ratchets_only && matrix.arch != 'pr-models' }}
      # Eight tests and one interpreter start: seconds. The bound leaves the model families' ~18 minutes and the upload
      # inside the job limit even when the suites end at the watchdog deadline (about 123 minutes into the job).
      timeout-minutes: 5
      run: >-
        dotnet test AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
        --configuration Release --no-build --framework net10.0
        --filter "FullyQualifiedName~.DLPackTorchInteropTests."
        --results-directory "${{ runner.temp }}/trx" --logger "trx;LogFileName=cuda-torch-interop.trx"

    - name: Managed stacks of a hung or crashed test host
      if: failure()
      # A hang dump is the whole test host (several GB), too big to download and analyse in practice; Blame names only
      # the test that was running, not the thread that is blocked. Print every managed thread's stack here instead.
      run: |
        # A directory the search cannot read is reported, not taken for "no dump"; any dumps found are still analysed.
        $dumps = @(Get-ChildItem "${{ runner.temp }}/trx" -Recurse -Filter *.dmp -ErrorAction SilentlyContinue -ErrorVariable searchErrors)
        foreach ($searchError in $searchErrors) { Write-Output "::warning::Dump search: $($searchError.Exception.Message)" }
        if ($dumps.Count -eq 0) {
          if ($searchErrors.Count -gt 0) { Write-Output "::error::No dump found, but the search was incomplete."; exit 1 }
          Write-Output "No crash or hang dump."; exit 0
        }
        $tools = "${{ runner.temp }}/dotnet-dump"
        dotnet tool install dotnet-dump --tool-path $tools | Out-Null
        if ($LASTEXITCODE -ne 0) { Write-Output "::error::Could not install dotnet-dump; $($dumps.Count) dump(s) not analysed."; exit 1 }
        # Every dump is analysed; one that fails is named and fails the step after the rest have printed.
        $failed = @()
        foreach ($dump in $dumps) {
          Write-Output "::group::$($dump.Name)"
          & "$tools/dotnet-dump" analyze $dump.FullName -c "clrthreads" -c "clrstack -all" -c "exit"
          $code = $LASTEXITCODE
          Write-Output "::endgroup::"
          if ($code -ne 0) { $failed += $dump.Name; Write-Output "::error::dotnet-dump analyze failed ($code) on $($dump.Name)." }
        }
        if ($failed.Count -gt 0) { exit 1 }
        # Dumps the search could not reach were never analysed: the found ones printed above, but the step still fails.
        if ($searchErrors.Count -gt 0) { Write-Output "::error::The dump search was incomplete; unreachable dumps were not analysed."; exit 1 }

    - name: Fail on unexplained skips
      if: ${{ always() && !inputs.ratchets_only && matrix.arch != 'pr-models' }}
      # Allowed skip reasons:
      #   - another backend's device or toolchain (this runner has CUDA, not necessarily HIP, Metal, Vulkan, WebGPU, or a
      #     Python with numpy and torch);
      #   - platform requirements: a Linux-only driver path (the RM ioctl interface), and the no-NVRTC diagnostic,
      #     which only runs where NVRTC is missing and the lane always installs it;
      #   - architecture requirements (an sm_ level, AVX-512 on the host CPU; off SM86, the specializations validated only
      #     there: the SM86/GA10x and Ampere reasons, the DirectPtx families' "<family>-architecture-not-implemented"
      #     (DirectPtxArchitecture admits each on SM 8.6 only) and the experimental generated convolution (SM 8.6 only),
      #     and the declared generated-kernel route, which is released on sm_75 and sm_86 only and so skips on the SM89
      #     Ada; there the declared tests' "needs the sm_75+ conveyor" reasons are that release check too, since
      #     DeclaredKernelsEnabled is false);
      #   - tracked baselines, each a listed gap with its own marker (NEEDS SPEC, TAPE-GRADIENT BASELINE, a forward with
      #     no differentiable leaf, the PTX transfer campaign's progress check);
      #   - opt-in benchmarks and probes, and wall-clock perf gates (they skip under CI=true);
      #   - "Not applicable: CUDA ...", a test of a mechanism CUDA deliberately does not use (it names CUDA's own).
      # Allowed test names: device classes of another backend (TorchParity*HipDeviceTests and the like), whose reasons say
      # only that no backend is available. A CUDA test skipping for any other reason fails the lane.
      # The two main parts and the torch interop host are checked apart, so each must have run tests of its own: a
      # filter that selected nothing cannot pass on another part's tests.
      env:
        ALLOWED_SKIP: '(?i)(HIP|ROCm|Metal|MoltenVK|Vulkan|WebGPU|Dawn|AIDOTNET_WEBGPU_NODE_DIR|OpenCL|POCL|DirectML|macOS)|requires sm_|compute capability|torch|numpy|python|PARITY_PYTHON|AVX-512|^NEEDS SPEC:|TAPE-GRADIENT BASELINE|forward recorded no differentiable leaf|Full PTX transfer not complete|^Not applicable: CUDA |Requires a non-CUDA|Linux-only|^NVRTC is present|benchmark|Wall-clock perf gate|run manually|manual perf harness|Manual CUDA|Diagnostic-only|Set (AIDOTNET|PARITY)_[A-Z0-9_]+=|AIDOTNET_GPU_MEMTRACK|AIDOTNET_KERNEL_REGISTRY_PERSIST${{ (matrix.arch == ''pr'' && steps.gpu.outputs.sm || matrix.arch) != ''sm86'' && ''|\bSM ?86\b|GA10[0-9x]|\bAmpere\b|-architecture-not-implemented$|^Experimental generated convolution is unavailable on this GPU architecture'' || '''' }}${{ (matrix.arch == ''pr'' && steps.gpu.outputs.sm || matrix.arch) == ''sm89'' && ''|declared route is (not released|off for this process)|^The declared route needs the sm_75\+ conveyor|^A declared resident program needs the sm_75\+ conveyor'' || '''' }}'
        ALLOWED_SKIP_TEST: '(Hip|Rocm|Dawn|WebGpu|Vulkan|Metal|MoltenVk|OpenCl|Pocl|DirectMl)[A-Za-z0-9]*Tests\.'
      run: |
        $failed = $false
        foreach ($part in @(@{ Title = 'CUDA (${{ steps.gpu.outputs.sm }}) Engines.DirectGpu'; Trx = 'cuda.trx' },
                            @{ Title = 'CUDA (${{ steps.gpu.outputs.sm }}) rest'; Trx = 'cuda-rest.trx' },
                            @{ Title = 'CUDA (${{ steps.gpu.outputs.sm }}) torch interop'; Trx = 'cuda-torch-interop.trx' })) {
          python AiDotNet.Tensors/scripts/ci/summarize-test-skips.py --title $part.Title --fail-on-skip `
            --allowed-skip $env:ALLOWED_SKIP --allowed-skip-test $env:ALLOWED_SKIP_TEST `
            (Join-Path "${{ runner.temp }}/trx" $part.Trx)
          if ($LASTEXITCODE -ne 0) { $failed = $true }
        }
        if ($failed) { exit 1 }


    - name: AiDotNet model families on CUDA (2 training steps, inference up to batch 128)
      if: (matrix.arch == 'sm86' || matrix.arch == 'pr-models') && !inputs.ratchets_only
      # About 18 minutes in a passing run (6 of them building AiDotNet); bounded so the job budget above holds.
      # densenet121's training hung on 2026-11-08 (main) and 2026-11-12 (#1724) and passed in 15 s in between; the step
      # timeout killed it with nothing printed. A watchdog 20 minutes in prints the GPU's processes and the managed
      # stacks of the benchmark process, then stops it, leaving the rest of the 26 minutes for the diagnostics.
      timeout-minutes: 26
      # Builds AiDotNet against this checkout (UseLocalTensors resolves ../../AiDotNet.Tensors from aidn/src), so the
      # model families exercise exactly this commit's kernels; the families were checked at the start of the job.
      run: |
        # This checkout can need a newer AiDotNet.Evolution than AiDotNet master pins (Tensors 0.7.0 vs AiDotNet
        # 0.6.0 failed restore with NU1605, a package downgrade). Raise AiDotNet's central pin to this commit's version,
        # as a consumer upgrading Tensors would; a newer pin on AiDotNet's side is kept.
        $tensorsProj = Get-Content AiDotNet.Tensors/src/AiDotNet.Tensors/AiDotNet.Tensors.csproj -Raw
        $want = [regex]::Match($tensorsProj, '<PackageReference Include="AiDotNet\.Evolution" Version="([^"]+)"').Groups[1].Value
        $props = 'aidn/Directory.Packages.props'
        $text = Get-Content $props -Raw
        $pin = [regex]::Match($text, '(<PackageVersion Include="AiDotNet\.Evolution" Version=")([^"]+)(")')
        if (-not $want -or -not $pin.Success) { Write-Output "::error::Could not read the AiDotNet.Evolution version from Tensors or AiDotNet."; exit 1 }
        if ([version]$pin.Groups[2].Value -lt [version]$want) {
          Write-Output "AiDotNet.Evolution: AiDotNet pins $($pin.Groups[2].Value), this Tensors needs $want; using $want."
          Set-Content $props ($text.Remove($pin.Groups[2].Index, $pin.Groups[2].Length).Insert($pin.Groups[2].Index, $want)) -NoNewline
        }
        $runArgs = 'run -c Release --project aidn/benchmarks/AiDotNet.PyTorchParity -p:UseLocalTensors=true -- ' +
          "--models $env:MODEL_FAMILIES --device cuda --epochs 1 --train-batches 2 --batch-size 64 " +
          "--inference-iterations 3 --warmup-iterations 1 --output `"${{ runner.temp }}/aidotnet-cuda.json`""
        $run = Start-Process dotnet -ArgumentList $runArgs -NoNewWindow -PassThru
        $null = $run.Handle   # cache the handle so ExitCode is readable after the process exits
        if ($run.WaitForExit(20 * 60 * 1000)) {
          if ($run.ExitCode -ne 0) { Write-Output "::error::An AiDotNet model family failed on CUDA."; exit 1 }
          exit 0
        }

        Write-Output "::error::The AiDotNet model families were still running 20 minutes in; the last [bench] line above names the model."
        try {
          # This run's processes only: the dotnet host and the benchmark it started (dotnet run builds, then runs it).
          $all = @(Get-CimInstance Win32_Process)
          $mine = @{}; $mine[[uint32]$run.Id] = $true
          do {
            $grew = $false
            foreach ($p in $all) {
              if ($mine.ContainsKey([uint32]$p.ParentProcessId) -and -not $mine.ContainsKey([uint32]$p.ProcessId)) {
                $mine[[uint32]$p.ProcessId] = $true; $grew = $true
              }
            }
          } while ($grew)
          $tree = @($all | Where-Object { $mine.ContainsKey([uint32]$_.ProcessId) })
          Write-Output "::group::Processes of this run"
          $tree | Format-Table ProcessId, ParentProcessId, Name, CreationDate -AutoSize | Out-String -Width 200
          Write-Output "::endgroup::"
          # Each diagnostic is bounded, so a stalled driver, install or attach cannot outlast the step.
          Write-Output "::group::nvidia-smi"
          $smi = Start-Process nvidia-smi -NoNewWindow -PassThru
          if (-not $smi.WaitForExit(30000)) {
            Stop-Process -Id $smi.Id -Force -ErrorAction SilentlyContinue
            Write-Output "::warning::nvidia-smi did not finish within 30 seconds."
          }
          Write-Output "::endgroup::"

          $tools = "${{ runner.temp }}/dotnet-stack"
          if (-not (Test-Path "$tools/dotnet-stack*")) {
            $install = Start-Process dotnet -ArgumentList "tool install dotnet-stack --tool-path `"$tools`"" -NoNewWindow -PassThru
            if (-not $install.WaitForExit(120000)) {
              Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
              Write-Output "::warning::dotnet-stack did not install within 2 minutes; no stacks printed."
            }
          }
          if (Test-Path "$tools/dotnet-stack*") {
            foreach ($bench in @($tree | Where-Object { $_.Name -like 'AiDotNet.PyTorchParity*' })) {
              Write-Output "::group::Managed stacks of AiDotNet.PyTorchParity $($bench.ProcessId)"
              $report = Start-Process "$tools/dotnet-stack" -ArgumentList "report -p $($bench.ProcessId)" -NoNewWindow -PassThru
              if (-not $report.WaitForExit(120000)) {
                Stop-Process -Id $report.Id -Force -ErrorAction SilentlyContinue
                Write-Output "::warning::dotnet-stack did not finish within 2 minutes on $($bench.ProcessId)."
              }
              Write-Output "::endgroup::"
            }
          }
        } catch {
          Write-Output "::warning::Collecting the hang diagnostics failed: $($_.Exception.Message)"
        } finally {
          taskkill /T /F /PID $run.Id | Out-Null
        }
        exit 1

    # The CUDA step-time ratchets: each network's ours/PyTorch step ratio on this machine class may not rise above the
    # one recorded in parity/head-to-head-baseline.json. PyTorch compiles each network in every mode for up to an hour
    # (the runner's RunnerTimeout), far past a pull request's budget and the 15-minute hang blame, so they run nightly
    # and on dispatch on the RTX 3080 only (the SM86 job's limit is 600 minutes for it: at most about 217 minutes
    # before this step, 360 in it, and the upload). They run only after every earlier step passed, so a red night does
    # not hold the shared runner for hours more. A deferral (no baseline for the machine class, a torch that cannot reach
    # the device) fails the step, and so does a missing network: each of the nine must report a pass or a failure.
    - name: CUDA step-time ratchets (nightly)
      if: ${{ success() && matrix.arch == 'sm86' && github.event_name != 'pull_request' }}
      timeout-minutes: 360
      env:
        RATCHET_FILTER: ${{ inputs.ratchet_filter }}
      run: |
        # torch.compile's inductor builds C++ with MSVC on Windows: load the x64 build environment (vcvars64.bat of the
        # newest Visual Studio with the VC tools) into this step. Without it every ratchet defers, so fail here, naming
        # what the runner lacks, instead of reporting nine deferrals.
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = if (Test-Path $vswhere) {
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        }
        $vcvars = if ($vs) { Join-Path "$vs".Trim() 'VC\Auxiliary\Build\vcvars64.bat' }
        if (-not $vcvars -or -not (Test-Path $vcvars)) {
          Write-Output "::error::torch.compile needs MSVC (Visual Studio 2022 or Build Tools with the C++ x64 tools and a Windows SDK); this runner has none."
          exit 1
        }
        # Skip Platform: vcvars64 sets Platform=x64, MSBuild reads it as the Platform property, and dotnet test
        # --no-build then looks for bin\x64\Release while the build step wrote bin\Release ("test source file not found").
        foreach ($line in (cmd /c "`"$vcvars`" >nul && set")) {
          if ($line -match '^([^=]+)=(.*)$' -and $Matches[1] -ne 'Platform') {
            [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
          }
        }
        if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Output "::error::vcvars64.bat ran but cl.exe is not on PATH."; exit 1 }
        Write-Output "MSVC: $vs"
        if ($env:RATCHET_FILTER -and $env:RATCHET_FILTER -notmatch '^[A-Za-z0-9_.]+$') {
          Write-Output "::error::ratchet_filter may hold only letters, digits, '_' and '.' (got '$env:RATCHET_FILTER')."; exit 1
        }
        dotnet test AiDotNet.Tensors/tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj `
          --configuration Release --no-build --framework net10.0 `
          --filter "FullyQualifiedName~.HeadToHeadGpuNetworkTests.&Category=PyTorchParityGpu$(if ($env:RATCHET_FILTER) { "&FullyQualifiedName~$env:RATCHET_FILTER" })" `
          --results-directory "${{ runner.temp }}/ratchets" --logger "trx;LogFileName=cuda-ratchets.trx" `
          --blame-hang --blame-hang-timeout 75m --blame-crash
        $tests = $LASTEXITCODE
        python AiDotNet.Tensors/scripts/ci/summarize-test-skips.py --title "CUDA step-time ratchets" --fail-on-skip `
          "${{ runner.temp }}/ratchets/*.trx"
        $skips = $LASTEXITCODE
        $ran = @{}
        foreach ($trx in Get-ChildItem "${{ runner.temp }}/ratchets" -Recurse -Filter *.trx) {
          foreach ($r in ([xml](Get-Content $trx.FullName -Raw)).TestRun.Results.UnitTestResult) {
            if ($r.outcome -in 'Passed', 'Failed') { $ran[$r.testName] = $true }
          }
        }
        # A filtered dispatch selects only some networks on purpose; the full set must report only on an unfiltered run.
        $networks = if ($env:RATCHET_FILTER) { @() } else { @('Mlp', 'Cnn', 'Lstm', 'Gru', 'Transformer', 'Resnet18', 'CnnFp16', 'TransformerFp16', 'Resnet18Fp16') }
        if ($env:RATCHET_FILTER -and $ran.Count -eq 0) {
          Write-Output "::error::ratchet_filter '$env:RATCHET_FILTER' ran no ratchet test."; exit 1
        }
        $missing = @($networks |
          ForEach-Object { "AiDotNet.Tensors.Tests.Parity.HeadToHeadGpuNetworkTests.$($_)_Cuda_DoesNotRegress" } |
          Where-Object { -not $ran.ContainsKey($_) })
        foreach ($name in $missing) { Write-Output "::error::Ratchet $name did not run (no pass or failure in the results)." }
        if ($tests -ne 0 -or $skips -ne 0 -or $missing.Count -gt 0) { exit 1 }

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ (matrix.arch == 'sm86' || matrix.arch == 'pr') && 'gpu-cuda-results' || matrix.arch == 'pr-models' && 'gpu-cuda-results-models' || format('gpu-cuda-results-{0}', matrix.arch) }}
        path: |
          ${{ runner.temp }}/trx/**
          ${{ runner.temp }}/ratchets/**
          ${{ runner.temp }}/aidotnet-cuda.json
        if-no-files-found: ignore
        # A crash dump is the full test host (gigabytes); keep it only long enough to analyse.
        retention-days: 5
