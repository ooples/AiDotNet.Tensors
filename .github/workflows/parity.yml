name: PyTorch Parity

# Head-to-head parity against PyTorch (epic #1055, story #1059).
#
#   ratchet (every PR and push): the checked-in PyTorch surface is current for the pinned torch, no
#       coverage gap is new, every mapped symbol resolves, and the CPU head-to-head step-time ratio has
#       not regressed for this machine class. This lane gates.
#   parity (nightly): the absolute distance to parity. It fails while any PyTorch feature is unmapped
#       or any case is slower than PyTorch, so it is red by design until parity is reached.
#
# GPU cases (Category=PyTorchParityGpu) need an NVIDIA device and run locally via tools/parity/run-gpu.ps1.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      isa_ab:
        description: 'Skip the full parity run; time the CPU networks and the per-op breakdown with AVX-512 on and off'
        type: boolean
        default: false
      probe_modes:
        description: 'AVX-512 probe (exits on an AVX2 runner): space-separated NAME=VAR=VALUE[,VAR=VALUE] modes, NAME= for the default'
        type: string
        default: ''
      probe_filter:
        description: 'AIDOTNET_OP_FILTER for the probe breakdown'
        type: string
        default: ''
      probe_threads:
        description: 'AIDOTNET_OP_THREADS for the probe'
        type: string
        default: '1,2,4'
      probe_perf:
        description: 'perf-profile the probe breakdown rows matching this filter (default mode)'
        type: string
        default: ''
      probe_perf_threads:
        description: 'threads for the perf profile'
        type: string
        default: '4'
      probe_any_isa:
        description: 'probe on AVX2 runners too'
        type: boolean
        default: false
      probe_h2h:
        description: 'probe: per mode, also run these network head-to-heads (test-name filter), interleaved over probe_h2h_rounds'
        type: string
        default: ''
      probe_h2h_rounds:
        description: 'probe: interleaved rounds of the network head-to-heads'
        type: string
        default: '2'
      probe_perf_test:
        description: 'probe: perf-record this test filter (default mode) and report the top symbols'
        type: string
        default: ''

concurrency:
  group: parity-${{ github.ref }}-${{ github.event_name }}-${{ inputs.probe_modes != '' && github.run_id || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal torchVersion in parity/pytorch-surface.json; the ratchet fails otherwise.
  TORCH_VERSION: '2.11.0'
  PARITY_PYTHON: python

jobs:
  ratchet:
    if: github.event_name != 'schedule' && inputs.probe_modes == ''
    runs-on: ubuntu-latest
    # PyTorch is timed at its best: every execution mode, torch.compile included (see the parity job).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      # Compares the feature KEYS (category:name), not the file: signatures can render differently per
      # platform, and a signature change is not a new feature. A new or removed feature is.
      - name: The checked-in PyTorch surface is current
        run: |
          python tools/parity/extract_pytorch_surface.py --output "$RUNNER_TEMP/pytorch-surface.json"
          keys() { python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['torchVersion']); print('\n'.join(sorted(i['category']+':'+i['name'] for i in d['items'])))" "$1"; }
          keys parity/pytorch-surface.json > "$RUNNER_TEMP/checked-in.keys"
          keys "$RUNNER_TEMP/pytorch-surface.json" > "$RUNNER_TEMP/current.keys"
          if ! diff "$RUNNER_TEMP/checked-in.keys" "$RUNNER_TEMP/current.keys" > "$RUNNER_TEMP/surface.diff"; then
            echo "::error::parity/pytorch-surface.json is stale for torch ${TORCH_VERSION}: features were added or removed. Regenerate it with tools/parity/extract_pytorch_surface.py and review parity/coverage.json."
            head -60 "$RUNNER_TEMP/surface.diff"
            exit 1
          fi

      - name: Build
        run: |
          dotnet restore tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
          dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Ratchet
        run: |
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "FullyQualifiedName~PyTorchFeatureCoverageTests.Coverage_DoesNotRegress|FullyQualifiedName~HeadToHeadNetworkTests.Mlp_Cpu_DoesNotRegress|FullyQualifiedName~HeadToHeadNetworkTests.Cnn_Cpu_DoesNotRegress" \
            --logger "console;verbosity=detailed" | tee "$RUNNER_TEMP/ratchet.log"
          exit "${PIPESTATUS[0]}"

      # #1574: DLPack round trips with the real torch in this process, and torch-exported ResNet-18 and BERT-style
      # encoder through import -> ONNX export -> ONNX Runtime. Both test sets skip without their environment, so a
      # skip here means the lane is misconfigured and fails it.
      - name: Interop with PyTorch (DLPack, ONNX export)
        run: |
          python -m pip install "onnx==1.23.2"
          python tools/parity/export_torch_onnx.py --out "$RUNNER_TEMP/torch-onnx"
          # Assigned, then exported: `export X="$(cmd)"` would drop python's exit status.
          AIDOTNET_TORCH_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export AIDOTNET_TORCH_PYTHON
          export AIDOTNET_TORCH_ONNX_DIR="$RUNNER_TEMP/torch-onnx"
          dotnet build tests/AiDotNet.Tensors.Onnx.Tests/AiDotNet.Tensors.Onnx.Tests.csproj --configuration Release --framework net10.0
          set -o pipefail
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "FullyQualifiedName~DLPackTorchInteropTests&FullyQualifiedName!~Cuda_" | tee "$RUNNER_TEMP/interop.log"
          dotnet test tests/AiDotNet.Tensors.Onnx.Tests/AiDotNet.Tensors.Onnx.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "FullyQualifiedName~OnnxTorchExportTests|FullyQualifiedName~OnnxExportRoundTripTests" | tee -a "$RUNNER_TEMP/interop.log"
          # The CUDA case runs in the GPU lane; here every selected test must run.
          if grep -E 'Skipped: +[1-9]' "$RUNNER_TEMP/interop.log"; then
            echo "::error::An interop test skipped; AIDOTNET_TORCH_PYTHON / AIDOTNET_TORCH_ONNX_DIR or ONNX Runtime is not set up."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo '## PyTorch parity ratchet'
            echo '```'
            grep -E 'PyTorch [0-9]|mapped |step ratio|DEFERRED|regressed|Gaps (rose|fell)|phase|forward|backward|optimizer|^\s+step ' "$RUNNER_TEMP/ratchet.log" | sed 's/^\s*\[xUnit[^]]*\]\s*//' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A case with no baseline for this runner is skipped, and xUnit drops a skipped test's output, so
      # the per-mode timings are only in the results the harness writes.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytorch-parity-ratchet-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ratchet.log
            /tmp/aidotnet-parity/*-latest.json
          if-no-files-found: warn

  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_modes != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require AVX-512
        id: isa
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          if [ "${{ inputs.probe_any_isa }}" = "true" ] || grep -q avx512f /proc/cpuinfo; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "AVX2 runner: nothing to probe"; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.isa.outputs.run == '1'

      - name: Setup .NET
        if: steps.isa.outputs.run == '1'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        if: steps.isa.outputs.run == '1'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and perf
        if: steps.isa.outputs.run == '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true

      - name: Build
        if: steps.isa.outputs.run == '1'
        run: |
          dotnet restore tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
          dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Probe
        if: steps.isa.outputs.run == '1'
        env:
          AIDOTNET_OP_BREAKDOWN: '1'
          AIDOTNET_OP_FILTER: ${{ inputs.probe_filter }}
          AIDOTNET_OP_THREADS: ${{ inputs.probe_threads }}
          MODES: ${{ inputs.probe_modes }}
          H2H: ${{ inputs.probe_h2h }}
          H2H_ROUNDS: ${{ inputs.probe_h2h_rounds }}
          PARITY_PYTHON: python
        run: |
          out="$RUNNER_TEMP/probe.md"
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread' > "$out"
          if [ -n "$H2H" ]; then
            echo "## network head-to-heads, modes interleaved" >> "$out"
            echo '```' >> "$out"
            for r in $(seq "$H2H_ROUNDS"); do
              for spec in $MODES; do
                name="${spec%%=*}"; settings="${spec#*=}"
                (
                  IFS=','
                  for kv in $settings; do [ -n "$kv" ] && export "$kv"; done
                  unset IFS
                  dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0                     --filter "$H2H" --logger "console;verbosity=detailed" 2>&1                     | grep -E 'step ratio|IsAsFastAsPyTorch|forward  |backward  |optimizer  |step  |best vs best| modes| ok  | rejected' | grep -vE '^\s*$' | sed "s/^\s*/r$r $name /" | cut -c1-220 >> "$out" || true
                )
              done
            done
            echo '```' >> "$out"
          fi
          python tools/parity/cpu_op_breakdown_torch.py > "$RUNNER_TEMP/ops-torch.log"
          for spec in $MODES; do
            name="${spec%%=*}"; settings="${spec#*=}"
            (
              IFS=','
              for kv in $settings; do [ -n "$kv" ] && export "$kv"; done
              unset IFS
              dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
                --filter "FullyQualifiedName~CpuOpBreakdownBench" --logger "console;verbosity=detailed" \
                | grep OPBREAKDOWN | sed 's/^\s*//' > "$RUNNER_TEMP/ops-$name.log"
            )
            {
              echo "## mode ${name} ${settings}"
              echo '```'
              python tools/parity/join_op_breakdown.py "$RUNNER_TEMP/ops-$name.log" "$RUNNER_TEMP/ops-torch.log"
              echo '```'
            } >> "$out"
          done
          cat "$out"

      - name: JIT disassembly
        if: steps.isa.outputs.run == '1'
        continue-on-error: true
        run: |
          for f in /tmp/jit*.txt; do
            [ -f "$f" ] || continue
            echo "## $f"
            grep -n "; Assembly listing for method\|; Tier\|; FullOpts\|; optimized" "$f" | head -40
            awk '/; Assembly listing for method/{n++} n>0' "$f" | grep -vE '^\s*$' | head -1500
          done
      - name: Perf profile
        if: steps.isa.outputs.run == '1' && inputs.probe_perf != ''
        continue-on-error: true
        env:
          AIDOTNET_OP_BREAKDOWN: '1'
          AIDOTNET_OP_FILTER: ${{ inputs.probe_perf }}
          AIDOTNET_OP_THREADS: ${{ inputs.probe_perf_threads }}
          AIDOTNET_OP_SAMPLES: '2000'
          DOTNET_PerfMapEnabled: '1'
          DOTNET_EnableWriteXorExecute: '0'
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          PERF=${PERF:-perf}
          $PERF record -F 2000 -o "$RUNNER_TEMP/row.perf" -- dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj \
            --configuration Release --no-build --framework net10.0 --filter "FullyQualifiedName~CpuOpBreakdownBench" \
            --logger "console;verbosity=detailed" 2>&1 | grep OPBREAKDOWN
          {
            echo "## perf ${AIDOTNET_OP_FILTER} t${AIDOTNET_OP_THREADS}"
            echo '```'
            $PERF report -i "$RUNNER_TEMP/row.perf" --sort dso,sym --stdio 2>/dev/null | grep -E '^ +[0-9]' | head -40 | cut -c1-240
            echo '```'
          } | tee -a "$RUNNER_TEMP/probe.md"

      - name: Perf profile of a test
        if: steps.isa.outputs.run == '1' && inputs.probe_perf_test != ''
        continue-on-error: true
        env:
          DOTNET_PerfMapEnabled: '1'
          DOTNET_EnableWriteXorExecute: '0'
          PARITY_PYTHON: python
          DOTNET_ReadyToRun: '0'
          TESTF: ${{ inputs.probe_perf_test }}
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)
          PERF=${PERF:-perf}
          $PERF record -F 1000 -g -o "$RUNNER_TEMP/test.perf" -- dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj             --configuration Release --no-build --framework net10.0 --filter "$TESTF" --logger "console;verbosity=detailed" 2>&1 | grep -E 'step ratio|ZZ |ZT|ZM |ZC |ZS ' || true
          {
            echo "## perf test ${TESTF}"
            echo '```'
            $PERF report -i "$RUNNER_TEMP/test.perf" --no-children --sort comm,sym --stdio -g none 2>/dev/null | grep -E "^ +[0-9]" | head -90 | cut -c1-230
            echo '```'
          } | tee -a "$RUNNER_TEMP/probe.md"

      - name: Summary
        if: always() && steps.isa.outputs.run == '1'
        run: cat "$RUNNER_TEMP/probe.md" >> "$GITHUB_STEP_SUMMARY"

  parity:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.probe_modes == '')
    runs-on: ubuntu-latest
    # Every case times PyTorch in each mode it offers, torch.compile (default and max-autotune, with and without
    # channels_last) at both thread counts included, so a run compiles each network several times.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      - name: Build
        run: |
          dotnet restore tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
          dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Distance to parity
        if: ${{ !inputs.isa_ab }}
        run: |
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "Category=PyTorchParity" --logger "console;verbosity=detailed" | tee "$RUNNER_TEMP/parity.log"
          exit "${PIPESTATUS[0]}"

      - name: Per-operation breakdown (runner CPU)
        # Which convolution / linear pass loses on THIS night's CPU (the hosted runner's model and ISA vary: AVX2 or
        # AVX-512, AMD or Intel). Diagnostic only; it never fails the job. Under isa_ab the A/B step's default pass
        # produces the same table, so this one is skipped.
        if: ${{ always() && !inputs.isa_ab }}
        continue-on-error: true
        env:
          AIDOTNET_OP_BREAKDOWN: '1'
        run: |
          { lscpu | grep -E 'Model name|^CPU\(s\)|Thread'; grep -q avx512f /proc/cpuinfo && echo 'ISA: avx512f' || echo 'ISA: avx2'; } | tee "$RUNNER_TEMP/cpu.txt"
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "FullyQualifiedName~CpuOpBreakdownBench" --logger "console;verbosity=detailed" \
            | grep OPBREAKDOWN | sed 's/^\s*//' > "$RUNNER_TEMP/ops-tensors.log"
          python tools/parity/cpu_op_breakdown_torch.py > "$RUNNER_TEMP/ops-torch.log"
          python tools/parity/join_op_breakdown.py "$RUNNER_TEMP/ops-tensors.log" "$RUNNER_TEMP/ops-torch.log" | tee "$RUNNER_TEMP/ops.txt"

      - name: ISA A/B (AVX-512 on, off, and each AVX-512 route off alone)
        # Which losses come from this library's AVX-512 dispatch: the same networks and operations with the runtime's
        # AVX-512 support hidden (DOTNET_EnableAVX512=0, the .NET 10 switch for the whole AVX-512 group; .NET 10 no longer reads
        # the per-ISA DOTNET_EnableAVX512F), then with one AVX-512 route at a time switched to its AVX2
        # counterpart (the direct convolution kernel, the 6x32 direct GEMM tile, the packed GEMM's 16x16 tile), against
        # the same PyTorch. An AVX2 runner runs the default mode only.
        if: ${{ inputs.isa_ab }}
        continue-on-error: true
        env:
          AIDOTNET_OP_BREAKDOWN: '1'
        run: |
          { lscpu | grep -E 'Model name|^CPU\(s\)|Thread'; grep -q avx512f /proc/cpuinfo && echo 'ISA: avx512f' || echo 'ISA: avx2'; } | tee "$RUNNER_TEMP/cpu.txt"
          python tools/parity/cpu_op_breakdown_torch.py > "$RUNNER_TEMP/ops-torch.log"
          modes="on="
          if grep -q avx512f /proc/cpuinfo; then
            modes="$modes off=DOTNET_EnableAVX512=0 conv-avx2=AIDOTNET_DIRECT_CONV_AVX512=0 direct-gemm-avx2=AIDOTNET_V512_DIRECT=0 packed-gemm-avx2=AIDOTNET_AVX512_GEMM_TILE=0 streaming-avx512=AIDOTNET_AVX512_STREAMING=1"
          fi
          for spec in $modes; do
            mode="${spec%%=*}"; setting="${spec#*=}"
            if [ -n "$setting" ]; then export "$setting"; fi
            dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
              --filter "FullyQualifiedName~Mlp_Cpu_IsAsFastAsPyTorch|FullyQualifiedName~Cnn_Cpu_IsAsFastAsPyTorch|FullyQualifiedName~Resnet18_Cpu_IsAsFastAsPyTorch" \
              --logger "console;verbosity=detailed" > "$RUNNER_TEMP/isa-$mode.log" || true
            dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
              --filter "FullyQualifiedName~CpuOpBreakdownBench" --logger "console;verbosity=detailed" \
              | grep OPBREAKDOWN | sed 's/^\s*//' > "$RUNNER_TEMP/ops-tensors-$mode.log"
            python tools/parity/join_op_breakdown.py "$RUNNER_TEMP/ops-tensors-$mode.log" "$RUNNER_TEMP/ops-torch.log" > "$RUNNER_TEMP/ops-$mode.txt"
            {
              echo "## AVX-512 $mode ${setting}"
              echo '```'
              grep -E 'PyTorch [0-9]|takes [0-9.]+x|step ratio|Slowest phase' "$RUNNER_TEMP/isa-$mode.log" | sed 's/^\s*\[xUnit[^]]*\]\s*//' | cut -c1-400 | head -40 || true
              cat "$RUNNER_TEMP/ops-$mode.txt"
              echo '```'
            } | tee -a "$RUNNER_TEMP/isa.md"
            if [ -n "$setting" ]; then unset "${setting%%=*}"; fi
          done

      - name: Summary
        if: always()
        run: |
          {
            if [ -f "$RUNNER_TEMP/isa.md" ]; then cat "$RUNNER_TEMP/cpu.txt" "$RUNNER_TEMP/isa.md"; fi
            echo '## Distance to PyTorch parity'
            echo '```'
            grep -E 'Tensors is missing|^\s+[a-zA-Z.]+ \([0-9]+\):|PyTorch [0-9]|mapped |takes [0-9.]+x|step ratio|Slowest phase' "$RUNNER_TEMP/parity.log" | sed 's/^\s*\[xUnit[^]]*\]\s*//' | cut -c1-400 | head -80 || true
            echo '```'
            if [ -f "$RUNNER_TEMP/ops.txt" ]; then
              echo '## Per-operation breakdown'
              echo '```'
              cat "$RUNNER_TEMP/cpu.txt" "$RUNNER_TEMP/ops.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytorch-parity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/parity.log
            ${{ runner.temp }}/ops-*.log
            ${{ runner.temp }}/ops-*.txt
            ${{ runner.temp }}/isa-*.log
            ${{ runner.temp }}/isa.md
            ${{ runner.temp }}/cpu.txt
            /tmp/aidotnet-parity/*-latest.json
          if-no-files-found: warn
