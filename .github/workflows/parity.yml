name: PyTorch Parity

# Head-to-head parity against PyTorch (epic #1055, story #1059).
#
#   ratchet (every PR and push): the checked-in PyTorch surface is current for the pinned torch, no
#       coverage gap is new, every mapped symbol resolves, and the CPU head-to-head step-time ratio has
#       not regressed for this machine class. This lane gates.
#   parity (nightly): the absolute distance to parity. It fails while any PyTorch feature is unmapped
#       or any case is slower than PyTorch, so it is red by design until parity is reached.
#
# GPU cases (Category=PyTorchParityGpu) need an NVIDIA device and run locally via tools/parity/run-gpu.ps1.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal torchVersion in parity/pytorch-surface.json; the ratchet fails otherwise.
  TORCH_VERSION: '2.11.0'
  PARITY_PYTHON: python

jobs:
  ratchet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      # Compares the feature KEYS (category:name), not the file: signatures can render differently per
      # platform, and a signature change is not a new feature. A new or removed feature is.
      - name: The checked-in PyTorch surface is current
        run: |
          python tools/parity/extract_pytorch_surface.py --output "$RUNNER_TEMP/pytorch-surface.json"
          keys() { python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['torchVersion']); print('\n'.join(sorted(i['category']+':'+i['name'] for i in d['items'])))" "$1"; }
          keys parity/pytorch-surface.json > "$RUNNER_TEMP/checked-in.keys"
          keys "$RUNNER_TEMP/pytorch-surface.json" > "$RUNNER_TEMP/current.keys"
          if ! diff "$RUNNER_TEMP/checked-in.keys" "$RUNNER_TEMP/current.keys" > "$RUNNER_TEMP/surface.diff"; then
            echo "::error::parity/pytorch-surface.json is stale for torch ${TORCH_VERSION}: features were added or removed. Regenerate it with tools/parity/extract_pytorch_surface.py and review parity/coverage.json."
            head -60 "$RUNNER_TEMP/surface.diff"
            exit 1
          fi

      - name: Build
        run: |
          dotnet restore tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
          dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Ratchet
        run: |
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "FullyQualifiedName~PyTorchFeatureCoverageTests.Coverage_DoesNotRegress|FullyQualifiedName~HeadToHeadNetworkTests.Mlp_Cpu_DoesNotRegress" \
            --logger "console;verbosity=detailed" | tee "$RUNNER_TEMP/ratchet.log"
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## PyTorch parity ratchet'
            echo '```'
            grep -E 'PyTorch [0-9]|mapped |step ratio|DEFERRED|regressed|Gaps (rose|fell)|phase|forward|backward|optimizer|^\s+step ' "$RUNNER_TEMP/ratchet.log" | sed 's/^\s*\[xUnit[^]]*\]\s*//' | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      - name: Build
        run: |
          dotnet restore tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj
          dotnet build tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Distance to parity
        run: |
          dotnet test tests/AiDotNet.Tensors.Tests/AiDotNet.Tensors.Tests.csproj --configuration Release --no-build --framework net10.0 \
            --filter "Category=PyTorchParity" --logger "console;verbosity=detailed" | tee "$RUNNER_TEMP/parity.log"
          exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Distance to PyTorch parity'
            echo '```'
            grep -E 'Tensors is missing|^\s+[a-zA-Z.]+ \([0-9]+\):|PyTorch [0-9]|mapped |takes [0-9.]+x|step ratio|Slowest phase' "$RUNNER_TEMP/parity.log" | sed 's/^\s*\[xUnit[^]]*\]\s*//' | cut -c1-400 | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-parity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/parity.log
            /tmp/aidotnet-parity/*-latest.json
          if-no-files-found: warn
