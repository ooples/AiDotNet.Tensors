ptx-spectral:
  # direct-ptx-spectral-gate.yml
  pull_request:
    # Any emitter under Ptx/ can change the generated PTX, and the cubin tool
    # core decides how it is compiled and hashed. Naming individual kernels
    # here let most of the family change without ever running this gate, so
    # the pull_request filter now matches the push filter's breadth.
    - '.github/workflows/direct-ptx-spectral-gate.yml'
    - 'src/AiDotNet.Tensors/Engines/DirectGpu/CUDA/Ptx/**'
    - 'tests/AiDotNet.Tensors.Benchmarks/DirectPtxSpectralCubinTool.cs'
    - 'tests/AiDotNet.Tensors.Benchmarks/DirectPtxCubinToolCore.cs'
    - 'tests/AiDotNet.Tensors.Benchmarks/Program.cs'
