gemm-bench:
  # gemm-bench.yml
  # Auto no-regression gate: runs on PRs that touch the GEMM kernel or the bench
  # itself. On the default ubuntu-latest runner the small-M lever no-ops (the
  # shapes aren't under-tiled at <=~8 cores), so ON and OFF exercise the same
  # code path and the gate is a stable identical-code A/B. Point GEMM_BENCH_RUNNER
  # at a many-core runner (and use workflow_dispatch) to also validate the WIN.
  pull_request:
    - 'src/AiDotNet.Tensors/Engines/Simd/SimdGemm.cs'
    - 'src/AiDotNet.Tensors/Engines/BlasManaged/**'
    - 'tools/ConvParallelProbe/**'
    # The probe reads internals: this file's InternalsVisibleTo list decides whether it compiles.
    - 'src/AiDotNet.Tensors/AiDotNet.Tensors.csproj'
    - '.github/workflows/gemm-bench.yml'

cuda:
  # gpu-cuda-selfhosted.yml
  pull_request:
    - 'src/AiDotNet.Tensors/Engines/CuDnnNative.cs'
    - 'tests/AiDotNet.Tensors.Tests/Engines/DirectGpu/Cudnn*.cs'
    - 'tests/AiDotNet.Tensors.Tests/Engines/Gpu/CuDnn*.cs'
    - 'src/AiDotNet.Tensors/Engines/DirectGpu/**'
    - 'src/AiDotNet.Tensors/Engines/DirectGpuTensorEngine*.cs'
    - 'src/AiDotNet.Tensors/Engines/Gpu/**'
    # Shared paths that decide GPU residency and buffer lifetime: a CUDA regression there must surface before merge.
    - 'src/AiDotNet.Tensors/Engines/TensorScope.cs'
    - 'src/AiDotNet.Tensors/Engines/Autodiff/**'
    - 'src/AiDotNet.Tensors/LinearAlgebra/Tensor.cs'
    - 'src/AiDotNet.Tensors/LinearAlgebra/TensorStorage.cs'
    - 'src/AiDotNet.Tensors/Helpers/Autotune/**'
    - '.github/workflows/gpu-cuda-selfhosted.yml'
