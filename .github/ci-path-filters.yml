# Path filters for ci.yml's changes job: a filtered workflow runs on a pull request or push only when a
# changed file matches its list for that event (GitHub's glob syntax: * stays inside a directory, ** crosses
# them). These are the lists each workflow carried on its own pull_request and push triggers before ci.yml
# took them over; a workflow absent here, or an event absent under it, runs unfiltered.
ptx-capsule:
  # direct-ptx-capsule-gate.yml
  pull_request:
    - '.github/workflows/direct-ptx-capsule-gate.yml'
    - 'src/AiDotNet.Tensors/Engines/DirectGpu/CUDA/Ptx/PtxFusedSquashF32Kernel.cs'
    - 'src/AiDotNet.Tensors/Engines/DirectGpu/CUDA/Ptx/Artifacts/**'
    - 'tests/AiDotNet.Tensors.Benchmarks/DirectPtxCapsuleCubinTool.cs'
    - 'tests/AiDotNet.Tensors.Benchmarks/Program.cs'
  push:
    - '.github/workflows/direct-ptx-capsule-gate.yml'
    - 'src/AiDotNet.Tensors/Engines/DirectGpu/CUDA/Ptx/**'
    - 'tests/AiDotNet.Tensors.Benchmarks/DirectPtxCapsuleCubinTool.cs'

